<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<iframe src="index.html" style="width:1100px;height:600px;border:none"></iframe>
<div id="out" style="position:fixed;top:0;left:0;background:#fff;z-index:999;font:14px monospace;padding:6px"></div>
<script>
const f = document.querySelector('iframe');
let phase = 0;
f.addEventListener('load', () => {
  phase++;
  const w = f.contentWindow, d = f.contentDocument;
  if (phase === 1) {
    w.localStorage.setItem('filterState', JSON.stringify({a:['史铁生'], x:['毒鸡汤'], p:true}));
    f.src = 'index.html?r=2';
  } else {
    const sub = d.getElementById('listSub');
    let cbStates = '';
    d.querySelectorAll('#filterDropdown .filter-checkbox[data-author]').forEach(cb => {
      if (cb.dataset.author === '史铁生') cbStates += ' 史铁生=' + cb.checked;
    });
    document.getElementById('out').textContent =
      'STORE=[' + w.localStorage.getItem('filterState') + ']' +
      ' | SUB=[' + (sub ? sub.textContent : 'null') + ']' +
      ' | CB=' + cbStates +
      ' | aaSize=' + (w.activeAuthors !== undefined ? w.activeAuthors.size : '?');
  }
});
</script>
</body></html>
