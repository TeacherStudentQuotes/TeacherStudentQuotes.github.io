name: Rebuild font subset

on:
  push:
    branches: [main]
    paths:
      - 'quotes.js'
      - 'index.html'
      - 'tools/regen_font.py'

permissions:
  contents: write

jobs:
  subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install fonttools brotli

      - name: Rebuild subset
        run: python3 tools/regen_font.py

      - name: Amend font into triggering commit
        run: |
          if git diff --quiet -- STZHONGS.subset.woff2; then
            echo "字体无变化，跳过"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STZHONGS.subset.woff2
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:main
