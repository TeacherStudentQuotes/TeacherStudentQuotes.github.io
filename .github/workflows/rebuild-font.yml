name: Rebuild font subset

on:
  push:
    branches: [main]
    paths:
      - 'quotes.js'
      - 'index.html'
      - 'tools/regen_font.py'

permissions:
  contents: write

jobs:
  subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install fonttools brotli

      - name: Rebuild subset
        run: python3 tools/regen_font.py

      - name: Sync OG quote count
        run: |
          COUNT=$(grep -c 'new Quote(' quotes.js)
          sed -i -E "s/共 [0-9]+ 条师生名言/共 ${COUNT} 条师生名言/" index.html

      - name: Amend into triggering commit
        run: |
          CHANGED=0
          if ! git diff --quiet -- fonts/STZHONGS.subset.woff2; then
            git add fonts/STZHONGS.subset.woff2
            CHANGED=1
          fi
          if ! git diff --quiet -- index.html; then
            git add index.html
            CHANGED=1
          fi
          if [ "$CHANGED" = "0" ]; then
            echo "字体与OG均无变化，跳过"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:main
