name: Rebuild font subset & sync meta

on:
  push:
    branches: [main]
    paths:
      - 'quotes.js'
      - 'index.html'
      - 'fonts/STZHONGS.woff2'
      - 'tools/**'
      - '.github/workflows/rebuild-font.yml'

permissions:
  contents: write

concurrency:
  group: doc-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Rebuild font subset
        run: python3 tools/regen_font.py

      - name: Sync quote count into meta
        run: python3 tools/sync_meta.py

      - name: Stamp service worker cache version
        run: python3 tools/stamp_sw.py

      - name: Verify generated files are consistent
        run: |
          python3 tools/sync_meta.py --check
          python3 tools/stamp_sw.py --check

      - name: Commit and push if changed
        run: |
          git add fonts/STZHONGS.subset.woff2 index.html sw.js
          if git diff --cached --quiet; then
            echo "字体、数量、缓存版本均无变化，跳过"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 重建字体子集并同步元信息 [skip ci]"
          git push origin HEAD:main
