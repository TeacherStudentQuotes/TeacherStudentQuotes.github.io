<style>
:root, [data-theme="light"] {
  --bg: #f5f0e8;
  --paper: #fffef8;
  --text: #333;
  --text-2: #666;
  --text-3: #888;
  --border: #ddd8ce;
  --border-2: #e8e2d4;
  --border-3: #ccc;
  --glass-bg: rgba(255, 253, 247, 0.55);
  --glass-item-hover: rgba(140, 122, 90, 0.16);
  --glass-divider: rgba(140, 122, 90, 0.38);
  --glass-blur: blur(14px) saturate(1.35);
  --glass-border: rgba(140, 122, 90, 0.28);
  --glass-shadow:
    0 4px 14px rgba(96, 82, 54, 0.10),
    inset 0 1px 1px rgba(255, 255, 255, 0.90),
    inset 0 -1px 2px rgba(96, 82, 54, 0.14),
    inset 1px 0 1px rgba(255, 255, 255, 0.35),
    inset -1px 0 2px rgba(96, 82, 54, 0.08);
  --accent: #8a7d5e;
  --accent-hover: #756a4e;
  --hover: #eee;
  --hover-2: #faf7ef;
  --hover-3: #eee7d8;
  --pill-bg: #f3eddc;
  --pill-border: #e2dac6;
  --pill-text: #6b6353;
  --footer-bg: #faf6ec;
  --toast-bg: #4a4234;
  --toast-text: var(--paper);
  --indicator-bg: #2c2c2c;
  --indicator-text: var(--bg);
  --highlight: #ffe082;
  --highlight-text: var(--text);
  --mark: #ddd;
  --backdrop: rgba(40,34,22,0.4);
  --scroll: rgba(0,0,0,0.15);
  --scroll-hover: rgba(0,0,0,0.25);
  --shadow: rgba(0,0,0,0.18);
  --shadow-2: rgba(0,0,0,0.15);
}
[data-theme="dark"] {
  --bg: #171410;
  --paper: #211d15;
  --text: #e6dfd0;
  --text-2: #b0a894;
  --text-3: #8a8271;
  --border: #3a342a;
  --border-2: #2e2921;
  --border-3: #4a4436;
  --glass-bg: rgba(46, 40, 31, 0.5);
  --glass-item-hover: rgba(255, 244, 224, 0.09);
  --glass-divider: rgba(255, 244, 224, 0.22);
  --glass-blur: blur(14px) saturate(1.2);
  --glass-border: rgba(255, 244, 224, 0.16);
  --glass-shadow:
    0 4px 16px rgba(0, 0, 0, 0.40),
    inset 0 1px 1px rgba(255, 244, 224, 0.25),
    inset 0 -1px 2px rgba(0, 0, 0, 0.38),
    inset 1px 0 1px rgba(255, 244, 224, 0.10),
    inset -1px 0 2px rgba(0, 0, 0, 0.28);
  --accent: #b5a27a;
  --accent-hover: #c9b68d;
  --hover: #2e2921;
  --hover-2: #29241c;
  --hover-3: #2e2921;
  --pill-bg: #2e2921;
  --pill-border: #3a342a;
  --pill-text: #a89f8c;
  --footer-bg: #1d1a13;
  --toast-bg: #e6dfd0;
  --toast-text: #171410;
  --indicator-bg: #e6dfd0;
  --indicator-text: #171410;
  --highlight: #8a7320;
  --highlight-text: #f5ecd0;
  --mark: #4a4436;
  --backdrop: rgba(0,0,0,0.6);
  --scroll: rgba(255,255,255,0.15);
  --scroll-hover: rgba(255,255,255,0.25);
  --shadow: rgba(0,0,0,0.5);
  --shadow-2: rgba(0,0,0,0.4);
}

@font-face {
  font-family: 'Computer Modern';
  src: url('fonts/cmu.serif-roman.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
  /* 排除引号（U+2018–201F），让中文弯引号回退到华文中宋渲染 */
  unicode-range: U+0000-007F, U+00A0-024F, U+0250-02AF, U+02B0-02FF, U+0300-036F, U+0370-03FF, U+0400-04FF, U+2000-2017, U+2020-206F, U+2070-209F, U+20A0-20CF, U+2100-214F, U+2150-218F, U+2190-21FF, U+2200-22FF, U+2300-23FF, U+2460-24FF, U+2500-257F, U+2580-259F, U+25A0-25FF, U+2600-26FF;
}
/* STZhongsong 字体由 JS 手动加载以显示进度 */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 默认隐藏滚动条 */
::-webkit-scrollbar { display: none; }
html {
  overflow: hidden;
}

html, body, .filter-dropdown, .quote-view {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

/* 列表视图滚动条（低调样式） */
.bi {
  vertical-align: -0.125em;
  /* BI字体视觉中心偏高，flex居中布局里下移修正 */
  transform: translateY(0.0625em);
}

.list-empty {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--text-3);
  padding: 20px;
  font-size: 1.15rem;
  letter-spacing: 0.08em;
  pointer-events: none;
}
.list-empty[hidden] { display: none; }
.list-empty {
  flex-direction: column;
  gap: 4px;
}
.empty-clear-btn {
  margin-top: 12px;
  padding: 7px 18px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--glass-shadow);
  color: var(--text-2);
  font-family: inherit;
  font-size: 0.9rem;
  cursor: pointer;
  pointer-events: auto;
}
.empty-clear-btn:active {
  transform: scale(0.97);
}

.list-body {
  scrollbar-width: thin;
  scrollbar-color: var(--scroll) transparent;
}

.list-body::-webkit-scrollbar {
  display: block;
  width: 5px;
}

.list-body::-webkit-scrollbar-track {
  background: transparent;
}

.list-body::-webkit-scrollbar-thumb {
  background: var(--scroll);
  border-radius: 3px;
}

.list-body::-webkit-scrollbar-thumb:hover {
  background: var(--scroll-hover);
}

html, body {
  width: 100%;
  height: 100%;
  overscroll-behavior: none; /* 全页橡皮筋/pull-to-refresh 一律禁用 */
}

body {
  background: var(--bg);
  font-family: 'Computer Modern', 'STZhongsong', "SimSun", "宋体", serif;
  overflow: hidden;
}

/* ===== 列表视图 ===== */
.list-view {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.list-header {
  padding: 24px 40px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg);
  z-index: 10;
  position: relative;
}

.list-header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.title-wrap {
  display: flex;
  align-items: baseline;
  gap: 7px;
}

.list-header h1 {
  font-size: 2rem;
  color: var(--text);
  letter-spacing: 0.15em;
}

.list-header p {
  margin-top: 6px;
  font-size: 0.9rem;
  color: var(--text-3);
}

.filter-wrap {
  position: relative;
}

.search-wrap {
  position: relative;
}

/* 顶栏玻璃近乎全透+轻磨砂（其余玻璃件维持 0.55 白） */
.list-header .search-input,
.list-header .filter-btn,
.action-bar .filter-btn {
  background: rgba(255, 253, 247, 0.02);
  backdrop-filter: blur(0.5px) saturate(1.2);
  -webkit-backdrop-filter: blur(0.5px) saturate(1.2);
}

.quote-view {
  position: relative;
  z-index: 0;
}

.search-input {
  width: 180px;
  height: 36px;
  padding: 0 44px 0 32px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--glass-shadow);
  color: var(--text);
  border-radius: 999px;
  font-family: inherit;
  font-size: 0.95rem;
  outline: none;
}

.search-input:focus {
  border-color: transparent;
}

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(calc(-50% + 0.0625em));
  color: var(--text-3);
  font-size: 0.85rem;
  pointer-events: none;
}

.search-count {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.8rem;
  color: var(--text-3);
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  pointer-events: none;
}

.search-highlight {
  background: var(--highlight);
  color: var(--text);
  border-radius: 2px;
  padding: 0;
}

.list-jump-wrap {
  position: relative;
  display: inline-block;
}

@media (max-width: 600px) {
  .search-input {
    width: 120px;
    /* 16px 以下 iOS 聚焦输入框会自动缩放页面，会导致波纹等视口坐标错位 */
    font-size: 16px;
  }
  .jump-expand-input {
    font-size: 16px;
  }
}

.filter-btn {
  width: 36px;
  height: 36px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--glass-shadow);
  color: var(--text-2);
  border-radius: 999px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95rem;
  transition: background 0.15s, transform 0.1s;
}


.filter-dropdown {
  position: fixed;
  top: 24px;
  left: 24px;
  right: 24px;
  bottom: 24px;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 12px 40px var(--shadow);
  display: none;
  flex-direction: column;
  z-index: 320;
  overflow: hidden;
}

.filter-dropdown.show {
  display: flex;
}

.filter-backdrop {
  position: fixed;
  inset: 0;
  background: var(--backdrop);
  display: none;
  z-index: 315;
}

.filter-backdrop.show {
  display: block;
}

.filter-header {
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-2);
}

.filter-title {
  font-size: 1.05rem;
  font-weight: bold;
  color: var(--text);
}

.filter-close-btn {
  border: none;
  background: none;
  color: var(--text-3);
  font-size: 1.1rem;
  width: 32px;
  height: 32px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.filter-close-btn:hover {
  background: var(--hover-3);
  color: var(--text);
}

.filter-tags {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 4px 2px 12px;
}
.filter-tag-option {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 0.85rem;
  cursor: pointer;
  user-select: none;
  transition: opacity 0.15s ease;
}
.filter-tag-option input {
  display: none;
}
.filter-tag-option.off {
  opacity: 0.38;
  filter: saturate(0.2);
}
.filter-tag-option:hover {
  opacity: 1;
}
.filter-tag-count {
  font-size: 0.75rem;
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
}

.filter-options {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior-y: none;
  padding: 16px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
  align-content: start;
}

.filter-option {
  border: 1px solid var(--border-2);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 0.95rem;
  color: var(--text);
  cursor: pointer;
  background: var(--paper);
  display: flex;
  align-items: center;
  gap: 12px;
  max-height: 140px;
  transition: max-height .26s cubic-bezier(.4,0,.2,1), opacity .2s ease, padding .26s cubic-bezier(.4,0,.2,1), margin .26s cubic-bezier(.4,0,.2,1), border-color .26s ease, transform .26s cubic-bezier(.4,0,.2,1);
}
/* 作者显隐动画：布局跳变与 FLIP 补偿同 JS 任务内完成（浏览器无中间态渲染），
   位移用 WAAPI 补间，自身淡入淡出 */

.filter-option:hover {
  background: var(--bg);
}

.filter-option:has(.filter-checkbox[data-tag]):hover {
  background: inherit;
  filter: brightness(0.95);
}

.filter-option input[type="checkbox"] {
  width: 17px;
  height: 17px;
  accent-color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
}

.filter-option-main {
  flex: 1;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 10px;
  min-width: 0;
}

.filter-option-name {
  word-break: break-all;
}

.filter-abbr {
  font-size: 0.72rem;
  opacity: 0.65;
  margin-left: 0.45em;
}

.filter-option-pills {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
}

.filter-pill {
  font-size: 0.75rem;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--pill-bg);
  color: var(--pill-text);
  border: 1px solid var(--pill-border);
  white-space: nowrap;
}

.filter-option-count {
  font-size: 0.8rem;
  color: var(--text-3);
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  flex-shrink: 0;
}

.filter-footer {
  flex-shrink: 0;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border-top: 1px solid var(--border-2);
  background: var(--footer-bg);
}

.filter-confirm-btn {
  padding: 8px 28px;
  border: 1px solid var(--border-3);
  background: var(--accent);
  color: var(--paper);
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.95rem;
  cursor: pointer;
}

.filter-confirm-btn:hover {
  background: var(--accent-hover);
}

.filter-aux-btn {
  padding: 8px 18px;
  border: 1px solid var(--border-3);
  background: var(--paper);
  color: var(--text-2);
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.95rem;
  cursor: pointer;
}

.filter-aux-btn:hover {
  background: var(--hover);
}

.filter-section-title {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
  font-weight: bold;
  color: var(--accent);
  padding: 6px 2px 0;
}

.filter-section-btns {
  display: flex;
  gap: 2px;
}

.filter-section-btn {
  border: none;
  background: none;
  color: var(--accent);
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: normal;
  padding: 2px 8px;
  border-radius: 999px;
  cursor: pointer;
}

.filter-section-btn:hover {
  background: var(--hover-3);
}



.filter-footer .spacer {
  flex: 1;
}

@media (max-width: 600px) {
  .filter-dropdown {
    top: 12px;
    left: 12px;
    right: 12px;
    bottom: 12px;
  }
}

.list-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 40px 40px;
}

.list-item {
  padding: 14px 18px;
  margin-bottom: 10px;
  background: var(--paper);
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  display: flex;
  align-items: baseline;
  gap: 14px;
  border: 1px solid var(--border-2);
}

.list-item:hover {
  background: var(--hover-2);
  transform: translateX(4px);
  border-color: var(--border-3);
}

@keyframes flashItem {
  0%, 100% { background-color: var(--paper); }
  50% { background-color: var(--highlight); }
}

.list-item.flash {
  animation: flashItem 1s ease-in-out 2;
}

.list-item-index {
  font-size: 1rem;
  color: var(--text-2);
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  min-width: 42px;
  text-align: right;
  flex-shrink: 0;
  align-self: baseline;
}

.list-item-content {
  flex: 1;
  font-size: 1rem;
  color: var(--text);
  line-height: 1.6;
  word-break: break-all;
  overflow-wrap: anywhere;
}

.list-item-tags {
  display: none;
  flex-wrap: wrap;
  gap: 4px;
  justify-content: flex-end;
  align-content: flex-start;
  align-self: center;
  max-width: 170px;
  max-height: 3em;
  overflow: hidden;
  flex-shrink: 0;
}

@media (min-width: 601px) {
  .list-item-tags {
    display: flex;
  }
}

.tag-pill {
  display: inline-block;
  font-size: 0.72rem;
  line-height: 1.6;
  padding: 0 8px;
  border-radius: 999px;
  border: 1px solid;
  white-space: nowrap;
}

ruby {
  ruby-align: center;
  line-height: 1;
}

rt {
  font-size: 0.65em;
  color: var(--text-3);
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  line-height: 1.1;
}

.list-item {
  overflow: visible;
}

.list-item-author {
  font-size: 0.85rem;
  color: var(--text-3);
  flex-shrink: 0;
}

/* ===== 名言单页视图 ===== */
.quote-view {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  position: relative;
  display: none;
  overflow-y: hidden; /* 引言在任何机型都放得下(689条实测)；纵向浏览走JS手动scrollTop，原生滚动永不介入 */
  -webkit-overflow-scrolling: touch;
  touch-action: pinch-zoom; /* 单指平移全部交JS(横=翻页/纵=手动滚)，零原生滚动泄漏；保留双指缩放 */
  overscroll-behavior: none; /* 滚动到顶/底不再拽动整页 */
}

.quote-view.show {
  display: block;
}

.page {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: var(--paper);
  padding: 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.quote-mark {
  position: absolute;
  font-size: 8rem;
  color: var(--mark);
  font-family: 'STZhongsong', Georgia, serif;
  line-height: 1;
  user-select: none;
  z-index: 0;
}

.quote-mark.top-left {
  top: 30px;
  left: 40px;
}

.quote-mark.bottom-right {
  bottom: 30px;
  right: 40px;
}

[data-theme="dark"] .quote-content img { filter: invert(1); }

.quote-content {
  font-size: 1.8rem;
  line-height: 2.4;
  text-align: center;
  color: var(--text);
  max-width: 90%;
  word-break: break-all;
  overflow-wrap: anywhere;
  z-index: 2;
  transition: opacity 0.3s ease;
}

.quote-author {
  position: absolute;
  bottom: 80px;
  right: 80px;
  font-size: 1.3rem;
  color: var(--text-2);
  font-style: italic;
  transition: opacity 0.3s ease;
  z-index: 5;
}

.quote-author::before {
  content: "—— ";
}

.quote-tags {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 36px;
  padding-left: 8px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  max-width: 50%;
  z-index: 5;
}

.sw-version {
  font-family: ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;
  font-size: 0.68rem;
  color: var(--text-3);

/* 滑动手势图示：HugeIcons 圆角线性手型，单向循环——
   右侧直接闪现（不淡入），向左滑行先快后慢（ease-out），到左边渐隐后趁透明回右边重来 */
.help-swipe {

  margin-top: 16px;

  78%  { transform: translateX(-48px); opacity: 1; }

/* 主题揭示：克隆当前页面裹上新主题塞进全屏遮罩，circle() 从按钮中心渐放——
   圆外是旧页面实况，圆内是克隆的新主题页面；全程页面坐标系，
   任何浏览器/内核零偏差（替代已退役的 View Transitions 快照方案）
   健壮性：世代计数防连点错位；finished+定时器双保险防 promise 失语；
   换主题期间全局禁过渡防卡片 0.15s 背景残影 */
let diyGen = 0;
let themeAnimLock = false; /* true=揭示动画播放中，期间主题切换点击一律无效 */
/* ===== 动画互斥：页面"还在动"时主题切换一律拒绝（用户要求：滚动中/翻页中不能切主题）=====
   滚动活跃期=末次 scroll 事件 + 160ms 尾延——动量滚动事件连绵不断，活跃期自然顺延；
   两视图分开计时（列表容器 / 单页 JS 手动纵向滚动都产生 scroll 事件） */
let flipAnimLock = false;      /* renderQuote 方向性翻页动画生命周期锁 */
let listScrollBusyUntil = 0;
let quoteScrollBusyUntil = 0;
function animBusy() {
  return flipAnimLock || Date.now() < listScrollBusyUntil || Date.now() < quoteScrollBusyUntil;
}
(function bindAnimBusyScroll() {
  const bind = (id, setter) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('scroll', () => { setter(Date.now() + 160); }, { passive: true });
  };
  bind('listBody', (ts) => { listScrollBusyUntil = ts; });
  bind('quoteView', (ts) => { quoteScrollBusyUntil = ts; });
})();
function themeRevealDIY(evt, apply) {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { apply(); return; }
  if (themeAnimLock || animBusy()) return;
  themeAnimLock = true;
  const gen = ++diyGen;
  const prev = document.getElementById('diyReveal');
  if (prev) prev.remove();
  const btn = (evt && evt.currentTarget && evt.currentTarget.getBoundingClientRect) ? evt.currentTarget : null;
  const r = btn ? btn.getBoundingClientRect() : null;
  const x = r ? r.left + r.width / 2 : window.innerWidth / 2;
  const y = r ? r.top + r.height / 2 : window.innerHeight / 2;
  const isDark = document.documentElement.dataset.theme === 'dark';

  const overlay = document.createElement('div');
  overlay.id = 'diyReveal';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;pointer-events:none;';
  const inner = document.createElement('div');
  inner.dataset.theme = isDark ? 'light' : 'dark';
  inner.style.cssText = 'position:absolute;inset:0;overflow:hidden;background:var(--bg);';
  const clone = document.body.cloneNode(true);
  clone.style.cssText = 'position:absolute;left:' + (-window.scrollX) + 'px;top:' + (-window.scrollY) + 'px;width:100%;margin:0;';
  /* 克隆体内主题按钮预换目标图标：圆覆盖按钮的瞬间即是新图标，不必等收尾 */
  const targetIcon = isDark ? 'bi-moon-fill' : 'bi-sun-fill';
  ['themeBtnList', 'themeBtnQuote'].forEach((id) => {
    const cb = clone.querySelector('#' + id);
    if (cb) cb.innerHTML = '<i class="bi ' + targetIcon + '"></i>';
  });
  /* 克隆体内标签胶囊按目标主题预染色（单页视图左下角标签的变色要圆到色到） */
  try { refreshTagPills(clone, isDark ? 'light' : 'dark'); } catch (e) {}
  /* 克隆不复制容器滚动位（#listBody/#quoteView 等默认回 0）：揭示中圆内是新主题
     顶部、圆外旧主题在实况位置，收尾揭盖瞬间真身'跳'回实况位。双树同步把原页
     每个滚动容器的 scrollTop/Left 抄给克隆——此刻 body 未挂 overlay，两树
     结构严格对齐，先收集；挂树克隆有布局后再写入 */
  const scrollPairs = [];
  try {
    const srcW = document.createTreeWalker(document.body, NodeFilter.SHOW_ELEMENT);
    const dstW = document.createTreeWalker(clone, NodeFilter.SHOW_ELEMENT);
    let se, de;
    while ((se = srcW.nextNode()) && (de = dstW.nextNode())) {
      if (se.scrollTop || se.scrollLeft) scrollPairs.push([de, se.scrollTop, se.scrollLeft]);
    }
  } catch (e) {}
  inner.appendChild(clone);
  overlay.appendChild(inner);
  document.documentElement.classList.add('theme-swapping');
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  try { for (const p of scrollPairs) { p[0].scrollTop = p[1]; p[0].scrollLeft = p[2]; } } catch (e) {}

  const radius = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y)) + 8;
  let called = false;
  const once = () => {
    if (called || gen !== diyGen) return;
    called = true;
    try { apply(); } catch (e) {}
    /* 揭盖推迟一帧：真实页面先在遮罩底下以新主题完成一次绘制，
       否则懒引擎直接亮出旧色缓存层，再带过渡渐变到新色（残影） */
    let committed = false;
    const commit = () => {
      if (committed || gen !== diyGen) return;
      committed = true;
      try { overlay.remove(); } catch (e) {}
      document.body.style.overflow = '';
      themeAnimLock = false;
      /* 掐过渡的 class 再留一帧：overlay 移除后的首次 style/paint 必须发生在
         transition:none 之下——若恢复过渡发生在值变化的 style 计算之前，
         卡片 background 0.15s 过渡会补播（用户看到的"闪回原色再渐变"残影）
         gen 检查防竞态：新一轮动画已启动时，本轮的移除不得误伤新保护 */
      requestAnimationFrame(() => {
        if (gen !== diyGen) return;
        document.documentElement.classList.remove('theme-swapping');
      });
      setTimeout(() => {
        if (gen !== diyGen) return;
        document.documentElement.classList.remove('theme-swapping');
      }, 120);
    };
    requestAnimationFrame(commit);
    setTimeout(commit, 80); /* rAF 失语的引擎兜底 */
  };
  try {
    const anim = overlay.animate(
      [{ clipPath: 'circle(0px at ' + x + 'px ' + y + 'px)' },
       { clipPath: 'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)' }],
      { duration: 500, easing: 'cubic-bezier(.4,0,.2,1)' }
    );
    anim.finished.then(once).catch(() => {});
  } catch (e) { /* 引擎不支持 WAAPI clip 也保底收尾 */ }
  setTimeout(once, 560); /* finished 失语/迟到的引擎由定时器兜底 */
}

function toggleTheme(evt) {
  const isDark = document.documentElement.dataset.theme === 'dark';
  const apply = () => {
    if (isDark) {
      delete document.documentElement.dataset.theme;
      localStorage.setItem('theme', 'light');
    } else {
      document.documentElement.dataset.theme = 'dark';
      localStorage.setItem('theme', 'dark');
    }
    updateThemeIcons();
    refreshTagPills();
  };

  themeRevealDIY(evt, apply);
}

function updateThemeIcons() {
  const isDark = document.documentElement.dataset.theme === 'dark';
  ['themeBtnList', 'themeBtnQuote'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.innerHTML = `<i class="bi ${isDark ? 'bi-sun-fill' : 'bi-moon-fill'}"></i>`;
  });
}

// 每个标签一组固定的胶囊配色（底色 / 边框 / 文字），共 6 色，相近主题共用
const TAG_PALETTE_LIGHT = [
  ['#fde2e2', '#e8a1a1', '#a13c3c'], // 0 红
  ['#fdeadc', '#e2ae7e', '#9a5a24'], // 1 橙
  ['#e0f2de', '#96cf92', '#2f6b2c'], // 2 绿
  ['#dcecfb', '#8fbde8', '#2c5a8a'], // 3 蓝
  ['#ededed', '#c2c2c2', '#545454'], // 4 灰
  ['#f0e2cf', '#c9a678', '#7c5227'], // 5 棕
];
const TAG_PALETTE_DARK = [
  ['#3a2323', '#7a4040', '#d49090'], // 0 红
  ['#3a2c1e', '#7a5c38', '#d4a878'], // 1 橙
  ['#23331f', '#40663a', '#90c088'], // 2 绿
  ['#1e2a38', '#3a5a7a', '#88a8cc'], // 3 蓝
  ['#2a2a2a', '#555555', '#a0a0a0'], // 4 灰
  ['#33281c', '#6b5232', '#c0a078'], // 5 棕
];
function tagPalette(mode) {
  const m = mode || (document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
  return m === 'dark' ? TAG_PALETTE_DARK : TAG_PALETTE_LIGHT;
}
// 按含义固定配色；有意控制颜色数量，同类标签共用一色
const TAG_COLOR_SLOT = {
  '日常': 1,       // 橙：生活气（原灰与筛选未选态撞色，看着像没选上）
  '屎尿屁': 5,       // 棕
  '吹牛': 5,         // 棕：牛皮
  '脏话': 0,         // 红
  '暴言': 0,         // 红：与脏话同属嘴臭类
  '外貌身材': 0,     // 红：火辣
  '感情八卦': 0,     // 红：桃色
  '动物世界': 2,     // 绿
  '琪琪与小花花': 2, // 绿：花/植物
  '开车': 1,         // 橙
  '吃的': 1,         // 橙：食物
  '作业考试': 3,     // 蓝
  '学科': 3,         // 蓝
  '班级纪律': 3,     // 蓝
  '网络梗': 3,       // 蓝
  '名人梗': 3,       // 蓝
};
const tagColorMaps = { light: {}, dark: {} };

function tagColors(tag, mode) {
  const m = mode || (document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
  const map = tagColorMaps[m];
  if (!(tag in map)) {
    const palette = tagPalette(m);
    const n = tag in TAG_COLOR_SLOT
      ? TAG_COLOR_SLOT[tag]
      : Object.keys(map).length;
    map[tag] = palette[n % palette.length];
  }
  return map[tag];
}

// 主题切换后刷新已渲染的标签胶囊（root/mode 供克隆体按目标主题预染色）
function refreshTagPills(root, mode) {
  (root || document).querySelectorAll('.tag-pill').forEach(pill => {
    const tag = pill.textContent;
    const c = tagColors(tag, mode);
    pill.style.background = c[0];
    pill.style.borderColor = c[1];
    pill.style.color = c[2];
  });
  // 筛选下拉里的标签底色
  (root || document).querySelectorAll('#filterDropdown .filter-option').forEach(opt => {
    const cb = opt.querySelector('.filter-checkbox[data-tag]');
    if (!cb) return;
    const c = tagColors(cb.dataset.tag, mode);
    opt.style.background = c[0];
    opt.style.borderColor = c[1];
    const name = opt.querySelector('.filter-option-name');
    if (name) name.style.color = c[2];
  });
}

// 按标签名排序后一次性分配颜色，保证同一次加载中颜色稳定
function initTagColors() {
  const all = new Set();
  quotes.forEach(q => (q.tags || []).forEach(t => all.add(t)));
  [...all].sort().forEach((tag) => tagColors(tag));
}

function tagPillHtml(tag) {
  const c = tagColors(tag);
  return `<span class="tag-pill" style="background:${c[0]};border-color:${c[1]};color:${c[2]}">${escapeHtml(tag)}</span>`;
}

function renderMath(el) {
  if (typeof renderMathInElement !== 'function' || !el) return;
  if (!el.textContent.includes('$') && !el.textContent.includes('\\(')) return;
  try {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false
    });
  } catch (e) {
    console.error('KaTeX 渲染失败', e);
  }
}

const pinyinRegex = /([\u4e00-\u9fa5])\(([a-zA-Zāáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜüńňǹ\s]+?)\)/g;

function tokenizeContent(content) {
  const tokens = [];
  let lastIndex = 0;
  let match;
  pinyinRegex.lastIndex = 0;
  while ((match = pinyinRegex.exec(content)) !== null) {
    if (match.index > lastIndex) {
      for (const char of content.slice(lastIndex, match.index)) {
        tokens.push({ type: 'char', value: char });
      }
    }
    tokens.push({ type: 'ruby', char: match[1], pinyin: match[2] });
    lastIndex = pinyinRegex.lastIndex;
  }
  if (lastIndex < content.length) {
    for (const char of content.slice(lastIndex)) {
      tokens.push({ type: 'char', value: char });
    }
  }
  return tokens;
}

function renderContentWithPinyin(content, query = '') {
  const trimmed = content.trim();
  if (trimmed.startsWith('<img') || trimmed.startsWith('<svg')) {
    return content;
  }
  const tokens = tokenizeContent(content);
  let html = '';
  let i = 0;
  const lowerQuery = query.toLowerCase();
  while (i < tokens.length) {
    if (query) {
      const slice = tokens.slice(i, i + query.length).map(t => t.type === 'ruby' ? t.char : t.value).join('');
      if (slice.toLowerCase() === lowerQuery) {
        const matched = tokens.slice(i, i + query.length).map(t => renderToken(t)).join('');
        html += `<span class="search-highlight">${matched}</span>`;
        i += query.length;
        continue;
      }
    }
    html += renderToken(tokens[i]);
    i++;
  }
  return html;
}

function renderToken(t) {
  if (t.type === 'char') return escapeHtml(t.value);
  return `<ruby>${escapeHtml(t.char)}<rt>${escapeHtml(t.pinyin)}</rt></ruby>`;
}

function createFilter() {
  const dropdown = document.getElementById('filterDropdown');
  dropdown.innerHTML = '';
  const header = document.createElement('div');
  header.className = 'filter-header';
  header.innerHTML = `<span class="filter-title">筛选</span>` +
    `<button class="filter-close-btn" onclick="closeFilter()" title="关闭"><i class="bi bi-x-lg"></i></button>`;
  dropdown.appendChild(header);
  const authorCounts = {};
  quotes.forEach(q => {
    authorCounts[q.author] = (authorCounts[q.author] || 0) + 1;
  });
  const sortedAuthors = Object.entries(authorCounts)
    .sort((a, b) => b[1] - a[1])
    .map(entry => entry[0]);
  const tagCounts = {};
  quotes.forEach(q => {
    (q.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
  });
  const sortedTags = Object.entries(tagCounts)
    .sort((a, b) => b[1] - a[1])
    .map(entry => entry[0]);
  /* 初始隐藏集合：重建 DOM 时直接 display:none，不播收起动画
     （否则打开筛选窗会先看到满员网格再塌缩重排，视觉上“跳一下”）
     数据源统一用 excludedTags（applied 状态）：checkbox 渲染也用它，
     Esc/点外关闭=放弃 preview，重开时勾选与显隐都回到已确认状态，
     两者必然一致，全部早退，零动画 */
  const initiallyEligible = new Set();
  quotes.forEach(q => {
    const tags = q.tags || [];
    if (tags.every(t => !excludedTags.has(t))) initiallyEligible.add(q.author);
  });
  const options = document.createElement('div');
  options.className = 'filter-options';
  const makeSectionTitle = (text, kind) => {
    const title = document.createElement('div');
    title.className = 'filter-section-title';
    title.innerHTML = `<span>${text}</span>` +
      `<span class="filter-section-btns">` +
      `<button type="button" class="filter-section-btn" data-kind="${kind}" data-action="all">全选</button>` +
      `<button type="button" class="filter-section-btn" data-kind="${kind}" data-action="invert">反选</button>` +
      `</span>`;
    title.querySelectorAll('.filter-section-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (btn.dataset.action === 'all') toggleSelectAll(kind);
        else invertSelection(kind);
      });
    });
    return title;
  };
  if (sortedTags.length > 0) {
    options.appendChild(makeSectionTitle('标签', 'tag'));
    const tagWrap = document.createElement('div');
    tagWrap.className = 'filter-tags';
    sortedTags.forEach(tag => {
      const label = document.createElement('label');
      label.className = 'filter-tag-option';
      const c = tagColors(tag);
      const checked = !excludedTags.has(tag);
      label.style.background = c[0];
      label.style.borderColor = c[1];
      label.innerHTML = `<input type="checkbox" class="filter-checkbox" data-tag="${escapeHtml(tag)}"${checked ? ' checked' : ''}>` +
        `<span class="filter-tag-name" style="color:${c[2]}">${escapeHtml(tag)}</span>` +
        `<span class="filter-tag-count" style="color:${c[1]}">${tagCounts[tag]}</span>`;
      const cb = label.querySelector('input');
      const syncOff = () => label.classList.toggle('off', !cb.checked);
      syncOff();
      cb.addEventListener('click', (e) => {
        syncOff();
        updateSelectAllBtn('tag');
        syncAuthorVisibilityPreview();
        e.stopPropagation();
      });
      tagWrap.appendChild(label);
    });
    options.appendChild(tagWrap);
    options.appendChild(makeSectionTitle('作者', 'author'));
  }
  sortedAuthors.forEach(author => {
    const label = document.createElement('label');
    label.className = 'filter-option';
    const checked = !authorFilterApplied || activeAuthors.has(author);
    const count = authorCounts[author] || 0;
    let nameHtml = escapeHtml(author);
    let pillsHtml = '';
    const t = teachers.find(t => t.full === author);
    if (t) {
      nameHtml = `${escapeHtml(t.full)}<span class="filter-abbr">${escapeHtml(t.abbr)}</span>`;
      if (t.desc) pillsHtml += `<span class="filter-pill">${escapeHtml(t.desc)}</span>`;
      if (t.time) pillsHtml += `<span class="filter-pill">${escapeHtml(t.time)}</span>`;
    } else {
      const s = studentInfo(author);
      if (s) pillsHtml += `<span class="filter-pill">${s.cls}班${s.num}号</span>`;
    }
    label.innerHTML = `<input type="checkbox" class="filter-checkbox" data-author="${escapeHtml(author)}"${checked ? ' checked' : ''}>` +
      `<div class="filter-option-main"><span class="filter-option-name">${nameHtml}</span>` +
      (pillsHtml ? `<span class="filter-option-pills">${pillsHtml}</span>` : '') + `</div>` +
      `<span class="filter-option-count">${count}</span>`;
    if (!initiallyEligible.has(author)) label.style.display = 'none';
    label.querySelector('input').addEventListener('click', (e) => {
      updateSelectAllBtn('author');
      e.stopPropagation();
    });
    options.appendChild(label);
  });
  dropdown.appendChild(options);
  const footer = document.createElement('div');
  footer.className = 'filter-footer';
  footer.innerHTML = `<button class="filter-confirm-btn" onclick="confirmFilter()">确定</button>`;
  dropdown.appendChild(footer);
  updateSelectAllBtn('author');
  updateSelectAllBtn('tag');
  /* 不调 syncAuthorVisibility()：作者显隐已按 initiallyEligible 设为终态。
     若此处兜底，preview 未确认就关闭时会用旧 applied 状态倒算，
     与重建依据的勾选状态不一致，导致全部作者重播一遍收起/展开过渡 */
}

// 作者项是否可见（供全选/确认统计）
function isAuthorOptionVisible(cb) {
  const opt = cb.closest('.filter-option');
  return opt.style.display !== 'none';
}
// FLIP：重排瞬移改平滑过渡。first 为兄弟项快照 [{el,top,left}]，exclude 除外
function flipMove(parent, first, exclude) {
  if (!parent) return;
  first.forEach(f => {
    if (f.el === exclude || f.el.style.display === 'none') return;
    const last = f.el.getBoundingClientRect();
    const dx = f.left - last.left;
    const dy = f.top - last.top;
    if (!dx && !dy) return;
    f.el.style.transition = 'none';
    f.el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    requestAnimationFrame(() => {
      f.el.style.transition = '';
      f.el.style.transform = '';
    });
  });
}
function snapshotSiblings(parent, exclude) {
  if (!parent) return [];
  return [...parent.children]
    .filter(el => el !== exclude && el.style.display !== 'none')
    .map(el => { const r = el.getBoundingClientRect(); return { el, top: r.top, left: r.left }; });
}

function setAuthorOptionHidden(cb, hide) {
  const opt = cb.closest('.filter-option');
  if (hide) {
    if (opt.style.display === 'none') return;
    const parent = opt.parentElement;
    const first = snapshotSiblings(parent, opt);
    if (opt.animate) {
      opt.animate(
        [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.95)' }],
        { duration: 200, easing: 'ease' }
      );
    }
    /* 布局跳变与兄弟补偿同一任务：浏览器没见过未补偿的中间帧 */
    opt.style.display = 'none';
    flipMove(parent, first, opt);
  } else {
    if (opt.style.display !== 'none') return;
    const parent = opt.parentElement;
    const first = snapshotSiblings(parent, opt);
    opt.style.display = '';
    flipMove(parent, first, null);
    if (opt.animate) {
      opt.animate(
        [{ opacity: 0, transform: 'scale(.95)' }, { opacity: 1, transform: 'none' }],
        { duration: 200, easing: 'ease' }
      );
    }
  }
}

// 面板内预览版：按当前勾选状态（未点确定）即时收缩作者区
function syncAuthorVisibilityPreview() {
  const excluded = new Set();
  allTagCheckboxes().forEach(cb => { if (!cb.checked) excluded.add(cb.dataset.tag); });
  const eligible = new Set();
  quotes.forEach(q => {
    const tags = q.tags || [];
    if (tags.every(t => !excluded.has(t))) eligible.add(q.author);
  });
  document.querySelectorAll('#filterDropdown .filter-checkbox[data-author]').forEach(cb => {
    setAuthorOptionHidden(cb, !eligible.has(cb.dataset.author));
  });
}

// 作者区跟随标签选择：只显示拥有“当前未被排除标签”名言的作者
function syncAuthorVisibility() {
  const eligible = new Set();
  quotes.forEach(q => {
    const tags = q.tags || [];
    if (tags.every(t => !excludedTags.has(t))) eligible.add(q.author);
  });
  document.querySelectorAll('#filterDropdown .filter-checkbox[data-author]').forEach(cb => {
    setAuthorOptionHidden(cb, !eligible.has(cb.dataset.author));
  });
}

function allTagCheckboxes() {
  return [...document.querySelectorAll('#filterDropdown .filter-checkbox[data-tag]')];
}

function sectionBoxes(kind) {
  return kind === 'tag' ? allTagCheckboxes() : allFilterCheckboxes();
}

function updateSelectAllBtn(kind) {
  const btn = document.querySelector(`.filter-section-btn[data-kind="${kind}"][data-action="all"]`);
  if (!btn) return;
  const boxes = sectionBoxes(kind);
  btn.textContent = boxes.length > 0 && boxes.every(cb => cb.checked) ? '全不选' : '全选';
}

function toggleSelectAll(kind) {
  const boxes = sectionBoxes(kind);
  const allChecked = boxes.length > 0 && boxes.every(cb => cb.checked);
  boxes.forEach(cb => {
    cb.checked = !allChecked;
    const tagLabel = cb.closest('.filter-tag-option');
    if (tagLabel) tagLabel.classList.toggle('off', !cb.checked);
  });
  updateSelectAllBtn(kind);
  if (kind === 'tag') syncAuthorVisibilityPreview();
}

function invertSelection(kind) {
  sectionBoxes(kind).forEach(cb => {
    cb.checked = !cb.checked;
    const tagLabel = cb.closest('.filter-tag-option');
    if (tagLabel) tagLabel.classList.toggle('off', !cb.checked);
  });
  updateSelectAllBtn(kind);
  if (kind === 'tag') syncAuthorVisibilityPreview();
}

function confirmFilter(stay) {
  const prevAuthors = new Set(activeAuthors);
  activeAuthors.clear();
  allFilterCheckboxes().forEach(cb => {
    if (cb.checked) activeAuthors.add(cb.dataset.author);
  });
  // 被标签隐藏的作者：勾选状态冻结，不参与本次重建
  prevAuthors.forEach(a => {
    if (!activeAuthors.has(a) &&
        ![...document.querySelectorAll('#filterDropdown .filter-checkbox[data-author]')]
          .some(cb => cb.dataset.author === a && isAuthorOptionVisible(cb))) {
      activeAuthors.add(a);
    }
  });
  authorFilterApplied = true;
  excludedTags.clear();
  allTagCheckboxes().forEach(cb => {
    if (!cb.checked) excludedTags.add(cb.dataset.tag);
  });
  saveFilter();
  updateFilterParam();
  applySearch();
  syncAuthorVisibility();
  if (!stay) closeFilter();
}

let filterGen = 0;
function reducedMotion() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function closeFilter() {
  const dropdown = document.getElementById('filterDropdown');
  const backdrop = document.getElementById('filterBackdrop');
  if (!dropdown.classList.contains('show')) return;
  const gen = ++filterGen;
  const finish = () => {
    if (gen !== filterGen) return;
    dropdown.classList.remove('show');
    backdrop.classList.remove('show');
    dropdown.style.pointerEvents = '';
  };
  if (reducedMotion() || !dropdown.animate) { finish(); return; }
  /* 动画期间先摘交互，防连点；显示类等动画落地再摘 */
  dropdown.style.pointerEvents = 'none';
  dropdown.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, easing: 'ease-in' });
  if (backdrop.animate) backdrop.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, easing: 'ease-in' });
  setTimeout(finish, 140);
}


function studentInfo(name) {
  for (const [cls, list] of [[1, students[1]], [2, students[2]]]) {
    for (const entry of list) {
      for (const num in entry) {
        if (entry[num] === name) return { cls, num };
      }
    }
  }
  return null;
}

function openFilterPanel() {
  const dropdown = document.getElementById('filterDropdown');
  const backdrop = document.getElementById('filterBackdrop');
  /* 关闭动画播到一半又打开：旧收尾已失效（代次过期），须先亲手终结 */
  if (dropdown.style.pointerEvents === 'none') {
    filterGen++;
    dropdown.getAnimations().forEach(a => a.cancel());
    if (backdrop.getAnimations) backdrop.getAnimations().forEach(a => a.cancel());
    dropdown.classList.remove('show');
    backdrop.classList.remove('show');
    dropdown.style.pointerEvents = '';
  }
  if (dropdown.classList.contains('show')) return;
  const gen = ++filterGen;
  createFilter();
  closeActionMenu(); /* 筛选是独立模态，菜单让位 */
  dropdown.classList.add('show');
  backdrop.classList.add('show');
  if (!reducedMotion() && dropdown.animate) {
    dropdown.animate(
      [{ opacity: 0, transform: 'scale(.97)' }, { opacity: 1, transform: 'scale(1)' }],
      { duration: 170, easing: 'cubic-bezier(0,0,.2,1)' });
    if (backdrop.animate) backdrop.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 170, easing: 'ease-out' });
  }
}

function toggleFilter() {
  const dropdown = document.getElementById('filterDropdown');
  if (dropdown.classList.contains('show')) closeFilter();
  else openFilterPanel();
}

function highlightText(text, query) {
  if (!query) return escapeHtml(text);
  const lowerText = text.toLowerCase();
  const lowerQuery = query.toLowerCase();
  let result = '';
  let lastIndex = 0;
  let index = lowerText.indexOf(lowerQuery);
  while (index !== -1) {
    result += escapeHtml(text.slice(lastIndex, index));
    result += `<span class="search-highlight">${escapeHtml(text.slice(index, index + query.length))}</span>`;
    lastIndex = index + query.length;
    index = lowerText.indexOf(lowerQuery, lastIndex);
  }
  result += escapeHtml(text.slice(lastIndex));
  return result;
}

function applySearch() {
  const input = document.getElementById('searchInput');
  currentSearch = input ? input.value.trim() : '';
  updateSearchParam(currentSearch);
  let visibleCount = 0;
  allItems.forEach(item => {
    const author = item.dataset.author;
    const content = item.dataset.content;
    const matchesFilter = !authorFilterApplied || activeAuthors.has(author);
    const itemTags = item.dataset.tags ? item.dataset.tags.split(',') : [];
    const matchesTag = itemTags.every(t => !excludedTags.has(t));
    const matchesSearch = !currentSearch ||
      author.toLowerCase().includes(currentSearch.toLowerCase()) ||
      content.toLowerCase().includes(currentSearch.toLowerCase());
    if (matchesFilter && matchesTag && matchesSearch) {
      item.style.display = 'flex';
      visibleCount++;
      const contentSpan = item.querySelector('.list-item-content');
      const authorSpan = item.querySelector('.list-item-author');
      if (contentSpan) {
        contentSpan.innerHTML = renderContentWithPinyin(content, currentSearch);
        if (item.dataset.hasMath === '1') renderMath(contentSpan);
      }
      if (authorSpan) authorSpan.innerHTML = highlightText(author, currentSearch);
    } else {
      item.style.display = 'none';
    }
  });
  const countEl = document.getElementById('searchCount');
  if (countEl) countEl.textContent = currentSearch ? visibleCount : '';
  const emptyEl = document.getElementById('listEmpty');
  if (emptyEl) emptyEl.hidden = visibleCount !== 0;

  // 副标题：有实际过滤效果时追加“符合条件xxx”，全选则不显示
  const subP = document.getElementById('listSub');
  if (subP) {
    const hasFilter = (authorFilterApplied && activeAuthors.size < allAuthorsSet.size) || excludedTags.size > 0;
    let html = `师生名言“精选”，共 <span id="totalCount">${quotes.length}</span> 条`;
    if (hasFilter) {
      let fc = 0;
      allItems.forEach(item => {
        const author = item.dataset.author;
        const itemTags = item.dataset.tags ? item.dataset.tags.split(',') : [];
        if ((!authorFilterApplied || activeAuthors.has(author)) && itemTags.every(t => !excludedTags.has(t))) fc++;
      });
      html += `，${fc} 条符合条件`;
    }
    subP.innerHTML = html;
  }
}

/* 搜索防抖：快速连击键时合并重渲染，低端机不卡 */
let __searchTimer = null;
function scheduleSearch() {
  clearTimeout(__searchTimer);
  __searchTimer = setTimeout(applySearch, 120);
}

/* 空结果态一键复位：清空搜索词 + 作者/标签筛选，回全量 */
function clearAllFilters() {
  clearTimeout(__searchTimer);
  const input = document.getElementById('searchInput');
  if (input) input.value = '';
  activeAuthors.clear();
  excludedTags.clear();
  authorFilterApplied = false;
  saveFilter();
  updateFilterParam();
  createFilter();
  applySearch();
}

function updateSearchParam(search) {
  const url = new URL(location.href);
  if (search) {
    url.searchParams.set('search', search);
  } else {
    url.searchParams.delete('search');
  }
  history.replaceState(null, '', url.pathname + url.search + location.hash);
}

function readSearchParam() {
  const url = new URL(location.href);
  return url.searchParams.get('search') || '';
}

function updateFilterParam() {
  const url = new URL(location.href);
  url.searchParams.delete('authors');
  url.searchParams.delete('notags');
  /* 作者筛选只有真正缩小范围才写进网址：全选等价于不筛；全不选写成 authors=（空值=刻意空结果） */
  if (authorFilterApplied && activeAuthors.size < allAuthorsSet.size) {
    if (activeAuthors.size) url.search = appendListParam(url.search, 'authors', [...activeAuthors]);
    else url.searchParams.set('authors', '');
  }
  if (excludedTags.size) url.search = appendListParam(url.search, 'notags', [...excludedTags]);
  history.replaceState(null, '', url.pathname + url.search + location.hash);
}

/* 逗号拼接的列表参数：值各自编码、逗号保留字面量，网址更短（authors=甲,乙 而非 authors=甲&authors=乙） */
function appendListParam(search, key, values) {
  const enc = values.map(v => encodeURIComponent(v)).join(',');
  return search ? search + '&' + key + '=' + enc : '?' + key + '=' + enc;
}

function readFilterParams() {
  const url = new URL(location.href);
  if (!url.searchParams.has('authors') && !url.searchParams.has('notags')) return;
  activeAuthors.clear();
  excludedTags.clear();
  authorFilterApplied = url.searchParams.has('authors');
  const a = url.searchParams.get('authors');
  if (a) a.split(',').forEach(n => { if (n) activeAuthors.add(n); });
  const t = url.searchParams.get('notags');
  if (t) t.split(',').forEach(n => { if (n) excludedTags.add(n); });
  saveFilter();
}

document.addEventListener('click', (e) => {

  document.querySelectorAll('.filter-wrap').forEach(w => {

});

let quoteRenderGen = 0;
function renderQuote(index, dir) {
  quoteView.scrollTop = 0; /* 每条从顶开始：手势带跑的纵向位移不跨页残留 */
  const q = quotes[index - 1];
  const contentEl = document.getElementById('qContent');
  const authorEl = document.getElementById('qAuthor');
  const tagsEl = document.getElementById('qTags');
  const indEl = document.getElementById('pageIndicator');
  const gen = ++quoteRenderGen;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const els = [contentEl, authorEl, tagsEl, indEl].filter(Boolean);
  /* 同任务掐掉上一轮动画：base 状态即全显示，无中间帧可闪 */
  els.forEach(el => el.getAnimations().forEach(a => a.cancel()));

  const fill = () => {
    if (gen !== quoteRenderGen) return false;
    contentEl.innerHTML = renderContentWithPinyin(q.content, '');
    renderMath(contentEl);
    authorEl.innerHTML = escapeHtml(q.author);
    if (tagsEl) tagsEl.innerHTML = (q.tags || []).map(tagPillHtml).join('');
    const pageIndicatorNum = document.getElementById('pageIndicatorNum');
    if (pageIndicatorNum) pageIndicatorNum.textContent = index;
    /* 原稿按钮随本条数据显隐（无 src 的名言不显示） */
    window.__quoteIndex = index;
    const srcBtn = document.getElementById('srcBtn');
    if (srcBtn) srcBtn.style.display = q.src ? '' : 'none';
    return true;
  };

  if (reduced) { fill(); return; }

  /* 方向性翻页（纸页手感）：旧内容向翻页方向退，新内容从反方向进，
     两阶段重叠 30ms 让两页"擦"过去；直达（dir=0）退化为原地淡换 */
  const OUT_MS = 140, IN_MS = 240;
  flipAnimLock = true; /* 翻页动画生命周期内主题切换被拒（gen 守卫：被新一轮 renderQuote 取代时不得提前解锁） */
  setTimeout(() => { if (gen === quoteRenderGen) flipAnimLock = false; }, OUT_MS + IN_MS + 80);
  const slideOut = dir
    ? els.map((el, i) => el.animate(
        [{ opacity: 1, transform: 'translate(0px,0px)' },
         { opacity: 0, transform: 'translate(' + (-dir * 26) + 'px,' + (i === 3 ? -8 : 0) + 'px)' }],
        { duration: OUT_MS, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' }))
    : els.map(el => el.animate([{ opacity: 1 }, { opacity: 0 }],
        { duration: OUT_MS, easing: 'ease-in', fill: 'forwards' }));

  setTimeout(() => {
    if (gen !== quoteRenderGen) return;
    slideOut.forEach(a => { try { a.cancel(); } catch (e) {} });
    if (!fill()) return;
    els.forEach((el, i) => {
      const from = !dir ? { opacity: 0 }
        : (i === 3
            ? { opacity: 0, transform: 'translate(0px,8px)' }
            : { opacity: 0, transform: 'translate(' + (dir * 30) + 'px,0px)' });
      el.animate([from, { opacity: 1, transform: 'translate(0px,0px)' }],
        { duration: IN_MS, delay: i === 0 ? 0 : 30, easing: 'cubic-bezier(0,0,.2,1)', fill: 'backwards' });
    });
  }, OUT_MS - 30);
}

function setOgMeta(title, description) {
  document.querySelector('meta[property="og:title"]')?.setAttribute('content', title);
  document.querySelector('meta[property="og:description"]')?.setAttribute('content', description);
  document.querySelector('meta[name="twitter:title"]')?.setAttribute('content', title);
  document.querySelector('meta[name="twitter:description"]')?.setAttribute('content', description);
}

function showList() {
  closeActionMenu();
  listView.style.display = 'flex';
  quoteView.classList.remove('show');
  document.title = '名言';
  setOgMeta('师生名言精选', '纸页之间的 689 句师生对话');

  history.replaceState(null, '', location.pathname + location.search);

  /* 文档层滚动归零：scrollIntoView 类操作能绕过 overflow:hidden 以编程方式滚走文档，
     用户手指又滚不回来（overflow:hidden 拦截触摸滚动）——返回列表时这里强制归零 */
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;

  /* 列表位置已在单页翻页时同步过；这里同帧瞬时校正（无平滑、无闪烁），
     用户退出看到的就是已居中的列表；找不到（被筛选藏起）则恢复藏前滚动位 */
  if (!syncListNow()) {
    const lb = document.getElementById('listBody');
    if (lb) lb.scrollTop = listScrollMem;
  }
}

/* 列表静默锚定：把当前条居中到 #listBody，立即生效、无动画、无高亮。
   单页每次翻页后调用（列表被 quoteView 遮住，滚动不可见）；
   退出时 display:flex 之后同帧再校正一次兜底 */
function syncListNow() {
  const lb = document.getElementById('listBody');
  if (!lb) return false;
  /* 按 data-index（原名言号）找，不用 allItems[current-1]——筛选/搜索后
     allItems 是过滤子集，按下标取会锚错条目或越界无操作 */
  const cur = allItems.find(el => parseInt(el.dataset.index, 10) === current);
  if (!cur || !cur.offsetHeight) return false;  /* 被搜索/筛选藏起的条目不锚定 */
  const delta = cur.getBoundingClientRect().top - lb.getBoundingClientRect().top
    - (lb.clientHeight - cur.getBoundingClientRect().height) / 2;
  lb.scrollTop += delta;
  return true;
}

function showQuote(index, dir) {
  if (index < 1 || index >= total) return;
  if (themeAnimLock) return; /* 主题揭示播放中：翻页/跳转一律拒绝，防 reveal 收尾时错位 */
  closeActionMenu();
  current = index;
  syncListNow();
  /* display:none 往返会丢 #listBody 滚动位，藏起来之前记住（仅首次隐藏时；
     翻页期间列表已是 none，scrollTop 早被清零，不能覆盖记忆） */
  if (listView.style.display !== 'none') {
    const __lb = document.getElementById('listBody');
    listScrollMem = __lb ? __lb.scrollTop : 0;
  }
  listView.style.display = 'none';
  quoteView.classList.add('show');
  renderQuote(index, dir || 0);
  const q = quotes[index - 1];
  const preview = q.content.length > 20 ? q.content.slice(0, 20) + '...' : q.content;
  document.title = `名言 #${index} — ${q.author}：${preview}`;
  setOgMeta(document.title, preview + ' —— ' + q.author);

  updateHash();
}

function nextPage() {
  if (current < total - 1) showQuote(current + 1, 1);
}

function prevPage() {
  if (current > 1) showQuote(current - 1, -1);
}

function flashItemNow(item) {
  item.classList.remove('flash');
  void item.offsetWidth;
  item.classList.add('flash');
  setTimeout(() => item.classList.remove('flash'), 2000);
}

function runFlashAfterScroll(item) {
  const listBody = document.getElementById('listBody');
  let scrollTimer;
  let fallbackTimer;
  const cleanup = () => {
    listBody.removeEventListener('scroll', onScroll);
    clearTimeout(fallbackTimer);
    clearTimeout(scrollTimer);
  };
  const flash = () => {
    cleanup();
    flashItemNow(item);
  };
  const onScroll = () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(flash, 80);
  };
  listBody.addEventListener('scroll', onScroll);
  fallbackTimer = setTimeout(flash, 2000);
  onScroll();
}

function jumpToList(value) {
  const num = parseInt(value, 10);
  if (isNaN(num) || num < 1 || num > quotes.length) return;
  if (themeAnimLock) return; /* 主题揭示播放中：smooth 滚动会撞上冻结的克隆层 */
  activeAuthors.clear();
  excludedTags.clear();
  authorFilterApplied = false;
  currentSearch = '';
  const searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.value = '';
  applySearch();
  updateFilterParam();
  createFilter();
  const item = allItems.find(el => parseInt(el.dataset.index, 10) === num);
  if (item) {
    document.documentElement.scrollTop = 0;
    const lb = document.getElementById('listBody');
    const delta = item.getBoundingClientRect().top - lb.getBoundingClientRect().top
      - (lb.clientHeight - item.getBoundingClientRect().height) / 2;
    lb.scrollBy({ top: delta, behavior: 'smooth' });
    runFlashAfterScroll(item);
    document.querySelectorAll('.jump-expand-input').forEach(inp => { inp.value = ''; });
  }
}

function jumpToQuote(value) {
  const num = parseInt(value, 10);
  if (!isNaN(num) && num >= 1 && num < total) {
    if (num !== current) showQuote(num, Math.sign(num - current));
    document.querySelectorAll('.jump-expand-input').forEach(inp => { inp.value = ''; });
  } else {
    document.querySelectorAll('.jump-expand-input').forEach(inp => { inp.value = ''; });
  }
}

function updateHash() {
  history.replaceState(null, '', location.search + '#page=' + current);
}

function readHash() {
  const hash = location.hash;
  if (!hash) return 0;
  let num = 0;
  if (hash.startsWith('#page=')) {
    num = parseInt(hash.slice(6), 10);
  } else {
    num = parseInt(hash.slice(1), 10);
  }
  if (!isNaN(num) && num >= 1 && num < total) {
    return num;
  }
  return 0;
}

document.addEventListener('keydown', (e) => {
  if (!quoteView.classList.contains('show')) return;

/* ===== 看原稿 =====
   src 为 '册-页'（如 '2-7'）；纸上跨页的名言用加号拼多页（如 '2-3+2-4'）；
   心形纸便签用特殊标记 'heart'（source/心形纸.jpg） */
const SRC_VOL = { 1: '第一册', 2: '第二册', 3: '第三册' };
function sizeSrcCrop(crop) {
  const img = crop.querySelector('img');
  if (!img || !img.naturalWidth) return;
  const r = img.naturalWidth / img.naturalHeight;
  const multi = crop.closest('.src-body').classList.contains('multi');
  crop.style.aspectRatio = multi ? `${2 * r} / 1` : `${r} / 1`;
}
function openSource() {
  const idx = window.__quoteIndex; /* renderQuote 时同步 */
  const q = quotes[idx - 1];
  if (!q || !q.src) return;
  const body = document.getElementById('srcBody');
  const resolve = p => {
    if (p === 'heart') return { url: 'source/心形纸.jpg', cap: '心形纸', vol: null };
    const [vol, page] = p.split('-');
    const dir = SRC_VOL[vol];
    return { url: `source/${dir}/${dir} ${page}.jpg`, cap: `第 ${page} 页`, vol: dir };
  };
  const items = q.src.split('+').map(resolve);
  body.innerHTML = items.map(it =>
    `<figure class="src-page"><div class="src-crop">` +
    `<div class="src-skeleton"><span>加载中</span></div>` +
    `<img src="${encodeURI(it.url)}" alt="${it.cap}" draggable="false" ` +
    `onload="this.classList.add('on');sizeSrcCrop(this.closest('.src-crop'))" ` +
    `onerror="this.closest('.src-crop').querySelector('.src-skeleton span').textContent='加载失败'">` +
    `</div></figure>`
  ).join('');
  body.classList.toggle('multi', items.length > 1);
  const vols = [...new Set(items.map(i => i.vol).filter(Boolean))];
  const nums = items.map(i => i.cap.match(/\d+/)?.[0]).filter(Boolean);
  document.getElementById('srcCaption').textContent = items.length > 1
    ? (vols.length === 1 ? `${vols[0]} · 第 ${nums.join('、')} 页` : `第 ${nums.join('、')} 页`)
    : (items[0].vol ? `${items[0].vol} · ${items[0].cap}` : items[0].cap);
  document.getElementById('srcOverlay').classList.add('open');
}
function closeSource() { document.getElementById('srcOverlay').classList.remove('open'); }

/* 单页触摸滑动翻页：横向主导手势跟手拖动纸页（阻尼 0.35），
   阈值 50px 才放行翻页，不足则弹回；纵向滚动天然让位 */
(function initSwipeNav() {
  let sx = 0, sy = 0, st0 = 0, t0 = 0, active = false, axis = 0; /* 0未分轴 1横 2纵 */
  let velY = 0, lastY = 0, lastT = 0, flingRAF = 0;

  quoteView.addEventListener('touchstart', (e) => {
    if (!quoteView.classList.contains('show')) return;
    if (e.target.closest('button, input, .action-bar, a')) return;
    if (flingRAF) { cancelAnimationFrame(flingRAF); flingRAF = 0; }
    const t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY;
    st0 = quoteView.scrollTop;
    t0 = e.timeStamp;
    active = true; axis = 0;
    velY = 0; lastY = t.clientY; lastT = e.timeStamp;
  }, { passive: true });

  quoteView.addEventListener('touchmove', (e) => {
    if (!active) return;
    /* 单指 move 从第一帧起就掐掉默认行为（8px 分轴死区也不例外）：
       touch-action:pinch-zoom 已让浏览器无事可做，这里兜底不支持该值的浏览器 */
    if (e.touches.length === 1) e.preventDefault();
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (!axis) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; /* 分轴死区 */
      axis = Math.abs(dx) > Math.abs(dy) ? 1 : 2;
    }
    /* 横向(axis 1)：纸页绝不跟手（硬需求"整个页面不要动"——划动全程画面纹丝不动），
       这里只记录轨迹，是否翻页全由 touchend 按阈值判定后播放方向性动画 */
    if (axis === 2) {
      quoteView.scrollTop = st0 - dy; /* 手动纵向滚动，边缘天然钳制不拽动整页 */
      const dt = e.timeStamp - lastT;
      /* dt<4ms 的采样噪声太大丢弃；速度钳制防异常尖峰 */
      if (dt >= 4) { velY = Math.max(-2.5, Math.min(2.5, (lastY - t.clientY) / dt)); lastY = t.clientY; lastT = e.timeStamp; }
    }
  }, { passive: false });

  const end = (e) => {
    if (!active) return;
    active = false;
    if (themeAnimLock) { axis = 0; return; } /* 主题揭示播放中：本次手势的翻页判定/惯性作废 */
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (axis === 1) {
      /* 抬手才判定：够50px必翻，快速甩动(300ms内30px)也算 */
      const adx = Math.abs(dx);
      const quick = e.timeStamp - t0 < 300;
      if (adx > Math.abs(dy) && (adx >= 50 || (quick && adx >= 30))) {
        if (dx < 0) nextPage(); else prevPage();
      }
      /* 不够阈值：什么都不做——页面从头至尾没有移动过，无需回弹 */
    } else if (axis === 2) {
      /* 惯性：velY(px/ms) 转每帧位移，阻尼 0.94 衰减 */
      let v = velY * 16.7;
      if (Math.abs(v) < 1) return;
      const tick = () => {
        if (active) return; /* 新手势已接管 */
        quoteView.scrollTop += v;
        v *= 0.94;
        if (Math.abs(v) > 0.4) flingRAF = requestAnimationFrame(tick);
        else flingRAF = 0;
      };
      flingRAF = requestAnimationFrame(tick);
    }
    axis = 0;
  };
  quoteView.addEventListener('touchend', end, { passive: true });
  quoteView.addEventListener('touchcancel', end, { passive: true });
})();

async function getRealSize() {
  try {
    const res = await fetch('fonts/STZHONGS.subset.woff2', { headers: { 'Range': 'bytes=0-0' }, cache: 'no-store' });
    if (res.status === 206) {
      const range = res.headers.get('Content-Range'); // bytes 0-0/12582912
      if (range) {
        const m = range.match(/\/(\d+)$/);
        if (m) return parseInt(m[1], 10);
      }
    }
  } catch (e) {}
  return 0;
}

async function loadFontWithProgress() {
  // CSS默认隐藏，DOM渲染与CMU字体就绪后加.ready点亮
  const box = document.querySelector('.spinner-wrap');
  try {
    if (document.readyState === 'loading') {
      await new Promise((res) => document.addEventListener('DOMContentLoaded', res, { once: true }));
    }
    await Promise.race([
      Promise.all([
        document.fonts.load('16px "Computer Modern"'),
        document.fonts.load('italic 16px "Computer Modern"'),
      ]),
      new Promise((res) => setTimeout(res, 3000)),
    ]);
  } catch (e) {}
  box.classList.add('ready');

  const progressInt = document.getElementById('progressInt');
  const progressDecimal = document.getElementById('progressDecimal');
  const progressRing = document.getElementById('progressRing');
  const radius = progressRing.r.baseVal.value;
  const circumference = 2 * Math.PI * radius;
  progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
  progressRing.style.strokeDashoffset = circumference;

  function setProgress(percent) {
    progressInt.textContent = Math.floor(percent);
    progressDecimal.textContent = (percent % 1).toFixed(2).slice(1) + '%';
    progressRing.style.strokeDashoffset = circumference - (percent / 100) * circumference;
  }
  try {
    let total = await getRealSize();
    const response = await fetch('fonts/STZHONGS.subset.woff2');
    if (!total) {
      total = parseInt(response.headers.get('Content-Length') || '0', 10);
    }
    const reader = response.body.getReader();
    const chunks = [];
    let loaded = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.length;
      if (total) {
        setProgress((loaded / total) * 100);
      }
    }

    const allChunks = new Uint8Array(loaded);
    let pos = 0;
    for (const chunk of chunks) {
      allChunks.set(chunk, pos);
      pos += chunk.length;
    }

    // 以 data URL 注入 @font-face，确保华文中宋可用
    const blob = new Blob([allChunks], { type: 'font/woff2' });
    const dataUrl = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.onerror = rej;
      reader.readAsDataURL(blob);
    });
    const fontFaceStyle = document.createElement('style');
    fontFaceStyle.textContent = `@font-face{font-family:'STZhongsong';src:url('${dataUrl}') format('woff2');font-weight:normal;font-style:normal;font-display:swap;}`;
    document.head.appendChild(fontFaceStyle);

    setProgress(100);
  } catch (err) {
    console.error('字体加载失败', err);
  } finally {
    setTimeout(() => {
      document.getElementById('loadingOverlay').classList.add('hide');
    }, 200);
  }
}

// ===== Canvas 导出图片 =====
// 逻辑尺寸模拟桌面视口
const EXPORT_SCALE = 2;
// --- 迷你 LaTeX 渲染器：\frac \dfrac \sqrt \pi ---
let currentCtx = null, MATH_FS = 28;

// --- 正文排版 ---
let menuGen = 0;
function toggleActionMenu(which) {
  const target = document.getElementById('listDrawer');
  const backdrop = document.getElementById('drawerBackdrop');
  const opening = !target.classList.contains('open');
  closeActionMenu();
  if (opening) {
    menuGen++; /* 作废 closeActionMenu 可能挂起的收尾 */
    target.style.pointerEvents = '';
    target.classList.add('open');
    backdrop.classList.add('open');
    if (!reducedMotion() && target.animate) {
      target.animate(
        [{ opacity: 0, transform: 'translateY(-6px) scale(.97)' }, { opacity: 1, transform: 'translateY(0px) scale(1)' }],
        { duration: 150, easing: 'cubic-bezier(0,0,.2,1)' });
    }
  }
}

function closeActionMenu() {
  const gen = ++menuGen;
  const target = document.getElementById('listDrawer');
  const backdrop = document.getElementById('drawerBackdrop');
  if (backdrop.classList.contains('open')) backdrop.classList.remove('open'); /* CSS opacity 淡出 */
  if (!target.classList.contains('open')) { collapseJumpAll(); return; }
  const finish = () => {
    if (gen !== menuGen) return;
    target.classList.remove('open');
    collapseJumpAll();
  };
  if (reducedMotion() || !target.animate) { finish(); return; }
  target.style.pointerEvents = 'none';
  target.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 110, easing: 'ease-in' });
  setTimeout(finish, 130);
}

function toggleJumpExpand(el) {
  const input = el.querySelector('.jump-expand-input');
  if (input) { input.focus(); input.select(); }
}

function collapseJumpAll() {
  document.querySelectorAll('.jump-expand.open').forEach(j => j.classList.remove('open'));
}


updateThemeIcons();
loadFontWithProgress();

// PWA Service Worker：检测到新版本立即激活并自动刷新一次
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  let __swRefreshing = false;
  const setVer = (v) => {
    document.querySelectorAll('.sw-version').forEach((el) => {
      el.textContent = v || '';
      el.style.display = v ? '' : 'none';
    });
  };
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'VERSION') setVer((e.data.version || '').replace(/^tsq-/, ''));
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // 交接瞬间controller可能为null，不刷新徽标（马上reload重画，避免闪没）
    if (__swRefreshing) return;
    __swRefreshing = true;
    location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
    const kick = (worker) => {
      if (worker && navigator.serviceWorker.controller) {
        worker.postMessage({ type: 'SKIP_WAITING' });
      }
    };
    if (reg.active) reg.active.postMessage({ type: 'GET_VERSION' });
    if (reg.waiting) kick(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed') kick(nw);
      });
    });
    // 每次启动也检查一次服务端是否有新版
    setTimeout(() => reg.update().catch(() => {}), 3000);
  }).catch(() => {});
}

  if (input) input.value = initialSearch;
