<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名言</title>

<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
@font-face {
  font-family: 'Computer Modern';
  src: url('cmu.serif-roman.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
  /* 排除引号（U+2018–201F），让中文弯引号回退到华文中宋渲染 */
  unicode-range: U+0000-007F, U+00A0-024F, U+0250-02AF, U+02B0-02FF, U+0300-036F, U+0370-03FF, U+0400-04FF, U+2000-2017, U+2020-206F, U+2070-209F, U+20A0-20CF, U+2100-214F, U+2150-218F, U+2190-21FF, U+2200-22FF, U+2300-23FF, U+2460-24FF, U+2500-257F, U+2580-259F, U+25A0-25FF, U+2600-26FF;
}
/* STZhongsong 字体由 JS 手动加载以显示进度 */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 默认隐藏滚动条 */
::-webkit-scrollbar { display: none; }
html, body, .filter-dropdown, .quote-view {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

/* 列表视图滚动条（低调样式） */
.list-body {
  scrollbar-width: thin;
  scrollbar-color: rgba(0,0,0,0.15) transparent;
}

.list-body::-webkit-scrollbar {
  display: block;
  width: 5px;
}

.list-body::-webkit-scrollbar-track {
  background: transparent;
}

.list-body::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.15);
  border-radius: 3px;
}

.list-body::-webkit-scrollbar-thumb:hover {
  background: rgba(0,0,0,0.25);
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  background: #f5f0e8;
  font-family: 'Computer Modern', 'STZhongsong', "SimSun", "宋体", serif;
  overflow: hidden;
}

/* ===== 列表视图 ===== */
.list-view {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.list-header {
  padding: 24px 40px 16px;
  border-bottom: 1px solid #ddd8ce;
  flex-shrink: 0;
  background: #f5f0e8;
  z-index: 10;
}

.list-header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.list-header h1 {
  font-size: 2rem;
  color: #333;
  letter-spacing: 0.15em;
}

.list-header p {
  margin-top: 6px;
  font-size: 0.9rem;
  color: #888;
}

.filter-wrap {
  position: relative;
}

.search-wrap {
  position: relative;
}

.search-input {
  width: 180px;
  height: 36px;
  padding: 0 44px 0 32px;
  border: 1px solid #ccc;
  background: #fffef8;
  color: #333;
  border-radius: 999px;
  font-family: inherit;
  font-size: 0.95rem;
  outline: none;
}

.search-input:focus {
  border-color: #999;
}

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: #999;
  font-size: 0.85rem;
  pointer-events: none;
}

.search-count {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.8rem;
  color: #999;
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  pointer-events: none;
}

.search-highlight {
  background: #ffe082;
  color: #333;
  border-radius: 2px;
  padding: 0;
}

.list-jump-wrap {
  position: relative;
  display: inline-block;
}

@media (max-width: 600px) {
  .search-input {
    width: 120px;
    font-size: 0.9rem;
  }
}

.filter-btn {
  width: 36px;
  height: 36px;
  border: 1px solid #ccc;
  background: #fffef8;
  color: #555;
  border-radius: 999px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95rem;
}

.filter-btn:hover {
  background: #eee;
}

.filter-dropdown {
  position: fixed;
  top: 24px;
  left: 24px;
  right: 24px;
  bottom: 24px;
  background: #fffef8;
  border: 1px solid #ddd8ce;
  border-radius: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  display: none;
  flex-direction: column;
  z-index: 100;
  overflow: hidden;
}

.filter-dropdown.show {
  display: flex;
}

.filter-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(40, 34, 22, 0.4);
  display: none;
  z-index: 90;
}

.filter-backdrop.show {
  display: block;
}

.filter-header {
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid #e8e2d4;
}

.filter-title {
  font-size: 1.05rem;
  font-weight: bold;
  color: #333;
}

.filter-close-btn {
  border: none;
  background: none;
  color: #777;
  font-size: 1.1rem;
  width: 32px;
  height: 32px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.filter-close-btn:hover {
  background: #eee7d8;
  color: #333;
}

.filter-options {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior-y: none;
  padding: 16px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
  align-content: start;
}

.filter-option {
  border: 1px solid #e8e2d4;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 0.95rem;
  color: #333;
  cursor: pointer;
  background: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
}

.filter-option:hover {
  background: #f5f0e8;
}

.filter-option:has(.filter-checkbox[data-tag]):hover {
  background: inherit;
  filter: brightness(0.95);
}

.filter-option input[type="checkbox"] {
  width: 17px;
  height: 17px;
  accent-color: #8a7d5e;
  cursor: pointer;
  flex-shrink: 0;
}

.filter-option-main {
  flex: 1;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 10px;
  min-width: 0;
}

.filter-option-name {
  word-break: break-all;
}

.filter-option-pills {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filter-pill {
  font-size: 0.75rem;
  padding: 2px 10px;
  border-radius: 999px;
  background: #f3eddc;
  color: #6b6353;
  border: 1px solid #e2dac6;
  white-space: nowrap;
}

.filter-option-count {
  font-size: 0.8rem;
  color: #999;
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  flex-shrink: 0;
}

.filter-footer {
  flex-shrink: 0;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border-top: 1px solid #e8e2d4;
  background: #faf6ec;
}

.filter-confirm-btn {
  padding: 8px 28px;
  border: 1px solid #ccc;
  background: #8a7d5e;
  color: #fffef8;
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.95rem;
  cursor: pointer;
}

.filter-confirm-btn:hover {
  background: #756a4e;
}

.filter-aux-btn {
  padding: 8px 18px;
  border: 1px solid #ccc;
  background: #fffef8;
  color: #555;
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.95rem;
  cursor: pointer;
}

.filter-aux-btn:hover {
  background: #eee;
}

.filter-section-title {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
  font-weight: bold;
  color: #8a7d5e;
  padding: 6px 2px 0;
}

.filter-section-btns {
  display: flex;
  gap: 2px;
}

.filter-section-btn {
  border: none;
  background: none;
  color: #8a7d5e;
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: normal;
  padding: 2px 8px;
  border-radius: 999px;
  cursor: pointer;
}

.filter-section-btn:hover {
  background: #eee7d8;
}

.filter-toast {
  position: absolute;
  bottom: 76px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: #4a4234;
  color: #fffef8;
  padding: 10px 22px;
  border-radius: 999px;
  font-size: 0.9rem;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 110;
}

.filter-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.filter-footer .spacer {
  flex: 1;
}

@media (max-width: 600px) {
  .filter-dropdown {
    top: 12px;
    left: 12px;
    right: 12px;
    bottom: 12px;
  }
}

.list-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 40px 40px;
}

.list-item {
  padding: 14px 18px;
  margin-bottom: 10px;
  background: #fffef8;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  display: flex;
  align-items: baseline;
  gap: 14px;
  border: 1px solid #e8e3d9;
}

.list-item:hover {
  background: #faf7ef;
  transform: translateX(4px);
  border-color: #d5cfc4;
}

@keyframes flashItem {
  0%, 100% { background-color: #fffef8; }
  50% { background-color: #ffe082; }
}

.list-item.flash {
  animation: flashItem 1s ease-in-out 2;
}

.list-item-index {
  font-size: 1rem;
  color: #666;
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  min-width: 42px;
  text-align: right;
  flex-shrink: 0;
  align-self: baseline;
}

.list-item-content {
  flex: 1;
  font-size: 1rem;
  color: #333;
  line-height: 1.6;
  word-break: break-all;
  overflow-wrap: anywhere;
}

.list-item-tags {
  display: none;
  flex-wrap: wrap;
  gap: 4px;
  justify-content: flex-end;
  align-content: flex-start;
  align-self: center;
  max-width: 170px;
  max-height: 3em;
  overflow: hidden;
  flex-shrink: 0;
}

@media (min-width: 601px) {
  .list-item-tags {
    display: flex;
  }
}

.tag-pill {
  display: inline-block;
  font-size: 0.72rem;
  line-height: 1.6;
  padding: 0 8px;
  border-radius: 999px;
  border: 1px solid;
  white-space: nowrap;
}

ruby {
  ruby-align: center;
  line-height: 1;
}

rt {
  font-size: 0.65em;
  color: #888;
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  line-height: 1.1;
}

.list-item {
  overflow: visible;
}

.list-item-author {
  font-size: 0.85rem;
  color: #888;
  flex-shrink: 0;
}

/* ===== 名言单页视图 ===== */
.quote-view {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  position: relative;
  display: none;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.quote-view.show {
  display: block;
}

.page {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #fffef8;
  padding: 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.quote-mark {
  position: absolute;
  font-size: 8rem;
  color: #ddd;
  font-family: 'STZhongsong', Georgia, serif;
  line-height: 1;
  user-select: none;
  z-index: 0;
}

.quote-mark.top-left {
  top: 30px;
  left: 40px;
}

.quote-mark.bottom-right {
  bottom: 30px;
  right: 40px;
}

.quote-content {
  font-size: 1.8rem;
  line-height: 2.4;
  text-align: center;
  color: #333;
  max-width: 90%;
  word-break: break-all;
  overflow-wrap: anywhere;
  z-index: 2;
  transition: opacity 0.3s ease;
}

.quote-author {
  position: absolute;
  bottom: 80px;
  right: 80px;
  font-size: 1.3rem;
  color: #666;
  font-style: italic;
  transition: opacity 0.3s ease;
  z-index: 5;
}

.quote-author::before {
  content: "—— ";
}

.quote-tags {
  position: absolute;
  bottom: 16px;
  left: 16px;
  height: 36px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  max-width: 50%;
  z-index: 5;
}

.popover-trigger {
  position: relative;
  display: inline-block;
}

.popover {
  position: absolute;
  top: calc(100% + 10px);
  left: 0;
  background: #fffef8;
  border: 1px solid #ddd8ce;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  padding: 12px 14px;
  display: none;
  z-index: 210;
  min-width: 170px;
}

.popover.show {
  display: block;
}

.popover::before {
  content: '';
  position: absolute;
  top: -7px;
  left: var(--arrow-left, 50%);
  width: 12px;
  height: 12px;
  background: #fffef8;
  border-left: 1px solid #ddd8ce;
  border-top: 1px solid #ddd8ce;
  transform: translateX(-50%) rotate(45deg);
}

.popover-row {
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.popover-label {
  font-size: 0.9rem;
  color: #333;
}

.popover-input {
  width: 64px;
  height: 34px;
  padding: 0 6px;
  border: 1px solid #ccc;
  background: #fff;
  color: #333;
  border-radius: 6px;
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  font-size: 0.95rem;
  text-align: center;
  outline: none;
}

.popover-input:focus {
  border-color: #999;
}

.popover-total {
  font-size: 0.85rem;
  color: #888;
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
}

.page-indicator {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 30;
  width: 60px;
  height: 36px;
  background: #2c2c2c;
  color: #f5f0e8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  clip-path: polygon(25% 0%, 100% 0%, 100% 100%, 0% 100%);
  user-select: none;
}

#pageIndicatorNum {
  /* 梯形左边斜切，数字右移补偿，使左右视觉边距对称 */
  margin-left: 6px;
}

.action-bar {
  position: fixed;
  top: 16px;
  right: 20px;
  display: flex;
  align-items: center;
  padding: 4px;
  border-radius: 999px;
  background: #fffef8;
  border: 1px solid #ccc;
  z-index: 200;
}

.action-bar button {
  width: 42px;
  height: 42px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: #555;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}

.action-bar button:hover {
  background: #eee;
}

.action-bar button:active {
  background: #e0e0e0;
}

@media (max-width: 600px) {
  .action-bar {
    top: 14px;
    right: 14px;
    padding: 3px;
  }
  .action-bar button {
    width: 40px;
    height: 40px;
    font-size: 0.95rem;
  }
}

.click-zone {
  position: fixed;
  top: 0;
  width: 30%;
  height: 100%;
  cursor: pointer;
  z-index: 100;
}

.click-zone.left { left: 0; }
.click-zone.right { right: 0; }



@media (max-width: 600px) {
  .list-header { padding: 16px 20px 12px; }
  .list-header h1 { font-size: 1.5rem; }
  .list-body { padding: 12px 20px 20px; }
  .list-item-content { white-space: normal; }
  .page {
    padding: 80px 28px 100px;
    height: auto;
    min-height: 100%;
    justify-content: center;
  }
  .quote-content { font-size: 1.2rem; line-height: 1.7; max-width: 100%; }
  .quote-author { font-size: 1rem; bottom: 70px; right: 24px; }
  .quote-mark { font-size: 5.5rem; }
  .quote-mark.top-left { top: 24px; left: 24px; }
  .quote-mark.bottom-right { bottom: 24px; right: 24px; }
}
@media (max-width: 600px) {
  .popover { padding: 10px 12px; min-width: 140px; top: calc(100% + 8px); }
  .popover-input { width: 56px; height: 30px; font-size: 0.9rem; }
  .page-indicator { width: 48px; height: 32px; font-size: 0.85rem; }
}

.loading-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #f5f0e8;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  transition: opacity 0.4s ease;
}

.loading-overlay.hide {
  opacity: 0;
  pointer-events: none;
}

.spinner-wrap {
  position: relative;
  width: 100px;
  height: 100px;
  transform: scale(2);
}

.spinner {
  width: 100%;
  height: 100%;
  animation: spin 1.5s linear infinite;
}

.spinner-bg {
  fill: none;
  stroke: #ddd;
  stroke-width: 6;
}

.spinner-progress {
  fill: none;
  stroke: #333;
  stroke-width: 6;
  transition: stroke-dashoffset 0.1s linear;
}

.progress-num {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 1.4rem;
  color: #333;
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  z-index: 2;
}

.progress-decimal {
  font-size: 0.75rem;
  color: #888;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner-wrap">
    <svg class="spinner" viewBox="0 0 100 100">
      <circle class="spinner-bg" cx="50" cy="50" r="46"></circle>
      <circle class="spinner-progress" cx="50" cy="50" r="46" id="progressRing"></circle>
    </svg>
    <div class="progress-num" id="progressNum"><span id="progressInt">0</span><span class="progress-decimal" id="progressDecimal">.00%</span></div>
  </div>
</div>

<!-- 列表视图 -->
<div class="list-view" id="listView">
  <div class="list-header">
    <div class="list-header-top">
      <h1>名言</h1>
      <div class="list-header-actions" style="display:flex;align-items:center;gap:10px;">
        <div class="list-jump-wrap" id="listJumpWrap">
          <button class="filter-btn" onclick="toggleListJumpPopover()" title="跳转至"><i class="fas fa-hashtag"></i></button>
          <div class="popover popover-list" id="listJumpPopover">
            <div class="popover-row">
              <span class="popover-label">跳转至</span>
              <input type="number" id="listJumpInput" class="popover-input" min="1" onkeydown="if(event.key==='Enter'){this.blur();}" onblur="jumpToList(this.value)">
              <span class="popover-total">/ <span id="listJumpTotal"></span></span>
            </div>
          </div>
        </div>
        <div class="search-wrap">
          <input type="text" id="searchInput" class="search-input" placeholder="搜索..." oninput="applySearch()">
          <i class="fas fa-search search-icon"></i>
          <span class="search-count" id="searchCount"></span>
        </div>
        <div class="filter-wrap">
          <button class="filter-btn" onclick="toggleFilter()" title="筛选作者"><i class="fas fa-filter"></i></button>
          <div class="filter-backdrop" id="filterBackdrop"></div>
          <div class="filter-dropdown" id="filterDropdown"></div>
        </div>
      </div>
    </div>
    <p>师生名言“精选”，共 <span id="totalCount">0</span> 条</p>
  </div>
  <div class="list-body" id="listBody"></div>
</div>

<!-- 名言单页视图 -->
<div class="quote-view" id="quoteView">
  <div class="action-bar" id="actionBar">
    <button onclick="showList()" title="返回列表"><i class="fas fa-arrow-left"></i></button>
    <div class="popover-trigger">
      <button onclick="toggleJumpPopover()" title="跳转至"><i class="fas fa-hashtag"></i></button>
      <div class="popover popover-quote" id="jumpPopover">
      <div class="popover-row">
        <span class="popover-label">跳转至</span>
        <input type="number" id="quoteJumpInput" class="popover-input" min="1" onkeydown="if(event.key==='Enter'){this.blur();}" onblur="jumpToQuote(this.value)">
        <span class="popover-total">/ <span id="quoteJumpTotal"></span></span>
      </div>
    </div>
  </div>
</div>
<div class="click-zone left" onclick="prevPage()"></div>
  <div class="click-zone right" onclick="nextPage()"></div>
  <div class="page">
    <div class="quote-mark top-left">“</div>
    <div class="quote-content" id="qContent"></div>
    <div class="quote-tags" id="qTags"></div>
    <div class="quote-author" id="qAuthor"></div>
    <div class="quote-mark bottom-right">”</div>
    <div class="page-indicator" id="pageIndicator"><span id="pageIndicatorNum"></span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="quotes.js"></script>
<script>
let current = 0;
const total = quotes.length + 1;

const listView = document.getElementById('listView');
const quoteView = document.getElementById('quoteView');

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 每个标签一组固定的胶囊配色（底色 / 边框 / 文字），共 6 色，相近主题共用
const TAG_PALETTE = [
  ['#fde2e2', '#e8a1a1', '#a13c3c'], // 0 红
  ['#fdeadc', '#e2ae7e', '#9a5a24'], // 1 橙
  ['#e0f2de', '#96cf92', '#2f6b2c'], // 2 绿
  ['#dcecfb', '#8fbde8', '#2c5a8a'], // 3 蓝
  ['#ededed', '#c2c2c2', '#545454'], // 4 灰
  ['#f0e2cf', '#c9a678', '#7c5227'], // 5 棕
];
// 按含义固定配色；有意控制颜色数量，同类标签共用一色
const TAG_COLOR_SLOT = {
  '日常': 4,         // 灰：平淡中性
  '屎尿屁': 5,       // 棕
  '吹牛': 5,         // 棕：牛皮
  '脏话': 0,         // 红
  '暴言': 0,         // 红：与脏话同属嘴臭类
  '外貌身材': 0,     // 红：火辣
  '感情八卦': 0,     // 红：桃色
  '动物世界': 2,     // 绿
  '琪琪与小花花': 2, // 绿：花/植物
  '开车': 1,         // 橙
  '吃的': 1,         // 橙：食物
  '作业考试': 3,     // 蓝
  '学科': 3,         // 蓝
  '班级纪律': 3,     // 蓝
  '网络梗': 3,       // 蓝
  '名人梗': 3,       // 蓝
};
const tagColorMap = {};

function tagColors(tag) {
  if (!(tag in tagColorMap)) {
    const n = tag in TAG_COLOR_SLOT
      ? TAG_COLOR_SLOT[tag]
      : Object.keys(tagColorMap).length;
    tagColorMap[tag] = TAG_PALETTE[n % TAG_PALETTE.length];
  }
  return tagColorMap[tag];
}

// 按标签名排序后一次性分配颜色，保证同一次加载中颜色稳定
function initTagColors() {
  const all = new Set();
  quotes.forEach(q => (q.tags || []).forEach(t => all.add(t)));
  [...all].sort().forEach(tagColors);
}

function tagPillHtml(tag) {
  const c = tagColors(tag);
  return `<span class="tag-pill" style="background:${c[0]};border-color:${c[1]};color:${c[2]}">${escapeHtml(tag)}</span>`;
}

function renderMath(el) {
  if (typeof renderMathInElement !== 'function' || !el) return;
  if (!el.textContent.includes('$') && !el.textContent.includes('\\(')) return;
  try {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false
    });
  } catch (e) {
    console.error('KaTeX 渲染失败', e);
  }
}

const pinyinRegex = /([\u4e00-\u9fa5])\(([a-zA-Zāáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜüńňǹ\s]+?)\)/g;

function tokenizeContent(content) {
  const tokens = [];
  let lastIndex = 0;
  let match;
  pinyinRegex.lastIndex = 0;
  while ((match = pinyinRegex.exec(content)) !== null) {
    if (match.index > lastIndex) {
      for (const char of content.slice(lastIndex, match.index)) {
        tokens.push({ type: 'char', value: char });
      }
    }
    tokens.push({ type: 'ruby', char: match[1], pinyin: match[2] });
    lastIndex = pinyinRegex.lastIndex;
  }
  if (lastIndex < content.length) {
    for (const char of content.slice(lastIndex)) {
      tokens.push({ type: 'char', value: char });
    }
  }
  return tokens;
}

function renderContentWithPinyin(content, query = '') {
  const trimmed = content.trim();
  if (trimmed.startsWith('<img') || trimmed.startsWith('<svg')) {
    return content;
  }
  const tokens = tokenizeContent(content);
  let html = '';
  let i = 0;
  const lowerQuery = query.toLowerCase();
  while (i < tokens.length) {
    if (query) {
      const slice = tokens.slice(i, i + query.length).map(t => t.type === 'ruby' ? t.char : t.value).join('');
      if (slice.toLowerCase() === lowerQuery) {
        const matched = tokens.slice(i, i + query.length).map(t => renderToken(t)).join('');
        html += `<span class="search-highlight">${matched}</span>`;
        i += query.length;
        continue;
      }
    }
    html += renderToken(tokens[i]);
    i++;
  }
  return html;
}

function renderToken(t) {
  if (t.type === 'char') return escapeHtml(t.value);
  return `<ruby>${escapeHtml(t.char)}<rt>${escapeHtml(t.pinyin)}</rt></ruby>`;
}

let allItems = [];
const activeAuthors = new Set();
const excludedTags = new Set();
let currentSearch = '';

function createList() {
  initTagColors();
  document.getElementById('totalCount').textContent = quotes.length;
  const listBody = document.getElementById('listBody');
  allItems = [];
  quotes.forEach((q, i) => {
    const item = document.createElement('div');
    item.className = 'list-item';
    item.dataset.author = q.author;
    item.dataset.content = q.content;
    item.dataset.tags = (q.tags || []).join(',');
    item.dataset.index = i + 1;
    item.onclick = () => showQuote(i + 1);
    const preview = q.content;
    item.innerHTML = `
      <span class="list-item-index">${i + 1}</span>
      <span class="list-item-content">${renderContentWithPinyin(preview, '')}</span>
      <span class="list-item-tags">${(q.tags || []).map(tagPillHtml).join('')}</span>
      <span class="list-item-author">${escapeHtml(q.author)}</span>
    `;
    listBody.appendChild(item);
    renderMath(item.querySelector('.list-item-content'));
    allItems.push(item);
  });
  createFilter();
  document.getElementById('listJumpInput').max = quotes.length;
  document.getElementById('listJumpInput').placeholder = `1-${quotes.length}`;
  document.getElementById('listJumpTotal').textContent = quotes.length;
  document.getElementById('quoteJumpInput').max = quotes.length;
  document.getElementById('quoteJumpTotal').textContent = quotes.length;
}

function createFilter() {
  const dropdown = document.getElementById('filterDropdown');
  dropdown.innerHTML = '';
  const header = document.createElement('div');
  header.className = 'filter-header';
  header.innerHTML = `<span class="filter-title">筛选</span>` +
    `<button class="filter-close-btn" onclick="closeFilter()" title="关闭"><i class="fas fa-times"></i></button>`;
  dropdown.appendChild(header);
  const authorCounts = {};
  quotes.forEach(q => {
    authorCounts[q.author] = (authorCounts[q.author] || 0) + 1;
  });
  const sortedAuthors = Object.entries(authorCounts)
    .sort((a, b) => b[1] - a[1])
    .map(entry => entry[0]);
  const tagCounts = {};
  quotes.forEach(q => {
    (q.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
  });
  const sortedTags = Object.entries(tagCounts)
    .sort((a, b) => b[1] - a[1])
    .map(entry => entry[0]);
  const options = document.createElement('div');
  options.className = 'filter-options';
  const makeSectionTitle = (text, kind) => {
    const title = document.createElement('div');
    title.className = 'filter-section-title';
    title.innerHTML = `<span>${text}</span>` +
      `<span class="filter-section-btns">` +
      `<button type="button" class="filter-section-btn" data-kind="${kind}" data-action="all">全选</button>` +
      `<button type="button" class="filter-section-btn" data-kind="${kind}" data-action="invert">反选</button>` +
      `</span>`;
    title.querySelectorAll('.filter-section-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (btn.dataset.action === 'all') toggleSelectAll(kind);
        else invertSelection(kind);
      });
    });
    return title;
  };
  if (sortedTags.length > 0) {
    options.appendChild(makeSectionTitle('标签', 'tag'));
    sortedTags.forEach(tag => {
      const label = document.createElement('label');
      label.className = 'filter-option';
      const c = tagColors(tag);
      label.style.background = c[0];
      label.style.borderColor = c[1];
      const checked = !excludedTags.has(tag);
      label.innerHTML = `<input type="checkbox" class="filter-checkbox" data-tag="${escapeHtml(tag)}"${checked ? ' checked' : ''}>` +
        `<div class="filter-option-main"><span class="filter-option-name" style="color:${c[2]}">${escapeHtml(tag)}</span></div>` +
        `<span class="filter-option-count">${tagCounts[tag]}</span>`;
      label.querySelector('input').addEventListener('click', (e) => {
        updateSelectAllBtn('tag');
        e.stopPropagation();
      });
      options.appendChild(label);
    });
    options.appendChild(makeSectionTitle('作者', 'author'));
  }
  sortedAuthors.forEach(author => {
    const label = document.createElement('label');
    label.className = 'filter-option';
    const checked = activeAuthors.size === 0 || activeAuthors.has(author);
    const count = authorCounts[author] || 0;
    let nameHtml = escapeHtml(author);
    let pillsHtml = '';
    const t = teachers.find(t => t.full === author);
    if (t) {
      nameHtml = `${escapeHtml(t.abbr)}——${escapeHtml(t.full)}`;
      if (t.desc) pillsHtml += `<span class="filter-pill">${escapeHtml(t.desc)}</span>`;
      if (t.time) pillsHtml += `<span class="filter-pill">${escapeHtml(t.time)}</span>`;
    } else {
      const s = studentInfo(author);
      if (s) pillsHtml += `<span class="filter-pill">${s.cls}班${s.num}号</span>`;
    }
    label.innerHTML = `<input type="checkbox" class="filter-checkbox" data-author="${escapeHtml(author)}"${checked ? ' checked' : ''}>` +
      `<div class="filter-option-main"><span class="filter-option-name">${nameHtml}</span>` +
      (pillsHtml ? `<span class="filter-option-pills">${pillsHtml}</span>` : '') + `</div>` +
      `<span class="filter-option-count">${count}</span>`;
    label.querySelector('input').addEventListener('click', (e) => {
      updateSelectAllBtn('author');
      e.stopPropagation();
    });
    options.appendChild(label);
  });
  dropdown.appendChild(options);
  const footer = document.createElement('div');
  footer.className = 'filter-footer';
  footer.innerHTML = `<button class="filter-confirm-btn" onclick="confirmFilter()">确定</button>`;
  dropdown.appendChild(footer);
  updateSelectAllBtn('author');
  updateSelectAllBtn('tag');
}

function allFilterCheckboxes() {
  return [...document.querySelectorAll('#filterDropdown .filter-checkbox[data-author]')];
}

function allTagCheckboxes() {
  return [...document.querySelectorAll('#filterDropdown .filter-checkbox[data-tag]')];
}

function sectionBoxes(kind) {
  return kind === 'tag' ? allTagCheckboxes() : allFilterCheckboxes();
}

function updateSelectAllBtn(kind) {
  const btn = document.querySelector(`.filter-section-btn[data-kind="${kind}"][data-action="all"]`);
  if (!btn) return;
  const boxes = sectionBoxes(kind);
  btn.textContent = boxes.length > 0 && boxes.every(cb => cb.checked) ? '全不选' : '全选';
}

function toggleSelectAll(kind) {
  const boxes = sectionBoxes(kind);
  const allChecked = boxes.length > 0 && boxes.every(cb => cb.checked);
  boxes.forEach(cb => { cb.checked = !allChecked; });
  updateSelectAllBtn(kind);
}

function invertSelection(kind) {
  sectionBoxes(kind).forEach(cb => { cb.checked = !cb.checked; });
  updateSelectAllBtn(kind);
}

function confirmFilter() {
  activeAuthors.clear();
  allFilterCheckboxes().forEach(cb => {
    if (cb.checked) activeAuthors.add(cb.dataset.author);
  });
  if (activeAuthors.size === 0) {
    showFilterToast('至少选择一项');
    return;
  }
  excludedTags.clear();
  allTagCheckboxes().forEach(cb => {
    if (!cb.checked) excludedTags.add(cb.dataset.tag);
  });
  applySearch();
  closeFilter();
}

function closeFilter() {
  document.getElementById('filterDropdown').classList.remove('show');
  document.getElementById('filterBackdrop').classList.remove('show');
}

let filterToastTimer = null;
function showFilterToast(message) {
  const dropdown = document.getElementById('filterDropdown');
  let toast = dropdown.querySelector('.filter-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'filter-toast';
    dropdown.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(filterToastTimer);
  filterToastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function studentInfo(name) {
  for (const [cls, list] of [[1, students1], [2, students2]]) {
    for (const entry of list) {
      for (const num in entry) {
        if (entry[num] === name) return { cls, num };
      }
    }
  }
  return null;
}

function toggleFilter() {
  const dropdown = document.getElementById('filterDropdown');
  const backdrop = document.getElementById('filterBackdrop');
  const willShow = !dropdown.classList.contains('show');
  if (willShow) createFilter();
  dropdown.classList.toggle('show');
  backdrop.classList.toggle('show', willShow ? true : dropdown.classList.contains('show'));
}

function highlightText(text, query) {
  if (!query) return escapeHtml(text);
  const lowerText = text.toLowerCase();
  const lowerQuery = query.toLowerCase();
  let result = '';
  let lastIndex = 0;
  let index = lowerText.indexOf(lowerQuery);
  while (index !== -1) {
    result += escapeHtml(text.slice(lastIndex, index));
    result += `<span class="search-highlight">${escapeHtml(text.slice(index, index + query.length))}</span>`;
    lastIndex = index + query.length;
    index = lowerText.indexOf(lowerQuery, lastIndex);
  }
  result += escapeHtml(text.slice(lastIndex));
  return result;
}

function applySearch() {
  const input = document.getElementById('searchInput');
  currentSearch = input ? input.value.trim() : '';
  updateSearchParam(currentSearch);
  let visibleCount = 0;
  allItems.forEach(item => {
    const author = item.dataset.author;
    const content = item.dataset.content;
    const matchesFilter = activeAuthors.size === 0 || activeAuthors.has(author);
    const itemTags = item.dataset.tags ? item.dataset.tags.split(',') : [];
    const matchesTag = itemTags.every(t => !excludedTags.has(t));
    const matchesSearch = !currentSearch ||
      author.toLowerCase().includes(currentSearch.toLowerCase()) ||
      content.toLowerCase().includes(currentSearch.toLowerCase());
    if (matchesFilter && matchesTag && matchesSearch) {
      item.style.display = 'flex';
      visibleCount++;
      const contentSpan = item.querySelector('.list-item-content');
      const authorSpan = item.querySelector('.list-item-author');
      if (contentSpan) {
        contentSpan.innerHTML = renderContentWithPinyin(content, currentSearch);
        renderMath(contentSpan);
      }
      if (authorSpan) authorSpan.innerHTML = highlightText(author, currentSearch);
    } else {
      item.style.display = 'none';
    }
  });
  const countEl = document.getElementById('searchCount');
  if (countEl) countEl.textContent = currentSearch ? visibleCount : '';
}

function updateSearchParam(search) {
  const url = new URL(location.href);
  if (search) {
    url.searchParams.set('search', search);
  } else {
    url.searchParams.delete('search');
  }
  history.replaceState(null, '', url.pathname + url.search + location.hash);
}

function readSearchParam() {
  const url = new URL(location.href);
  return url.searchParams.get('search') || '';
}

document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.filter-wrap');
  if (wrap && !wrap.contains(e.target)) {
    closeFilter();
  }
  const actionBar = document.getElementById('actionBar');
  if (actionBar && !actionBar.contains(e.target)) {
    document.getElementById('jumpPopover').classList.remove('show');
  }
  const listJumpWrap = document.getElementById('listJumpWrap');
  if (listJumpWrap && !listJumpWrap.contains(e.target)) {
    document.getElementById('listJumpPopover').classList.remove('show');
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('jumpPopover').classList.remove('show');
    document.getElementById('listJumpPopover').classList.remove('show');
  }
});

function renderQuote(index) {
  const q = quotes[index - 1];
  const contentEl = document.getElementById('qContent');
  const authorEl = document.getElementById('qAuthor');

  contentEl.style.opacity = '0';
  authorEl.style.opacity = '0';

  setTimeout(() => {
    contentEl.innerHTML = renderContentWithPinyin(q.content, '');
    renderMath(contentEl);
    authorEl.innerHTML = escapeHtml(q.author);
    const tagsEl = document.getElementById('qTags');
    if (tagsEl) tagsEl.innerHTML = (q.tags || []).map(tagPillHtml).join('');
    const quoteJumpInput = document.getElementById('quoteJumpInput');
    if (quoteJumpInput) quoteJumpInput.value = index;
    const pageIndicatorNum = document.getElementById('pageIndicatorNum');
    if (pageIndicatorNum) pageIndicatorNum.textContent = index;
    contentEl.style.opacity = '1';
    authorEl.style.opacity = '1';
  }, 150);
}

function showList() {
  listView.style.display = 'flex';
  quoteView.classList.remove('show');
  document.title = '名言';

  history.replaceState(null, '', location.pathname + location.search);
}

function showQuote(index) {
  if (index < 1 || index >= total) return;
  current = index;
  listView.style.display = 'none';
  quoteView.classList.add('show');
  renderQuote(index);
  const q = quotes[index - 1];
  const preview = q.content.length > 20 ? q.content.slice(0, 20) + '...' : q.content;
  document.title = `名言 #${index} — ${q.author}：${preview}`;

  updateHash();
}

function nextPage() {
  if (current < total - 1) showQuote(current + 1);
}

function prevPage() {
  if (current > 1) showQuote(current - 1);
}

function runFlashAfterScroll(item) {
  const listBody = document.getElementById('listBody');
  let scrollTimer;
  let fallbackTimer;
  const cleanup = () => {
    listBody.removeEventListener('scroll', onScroll);
    clearTimeout(fallbackTimer);
    clearTimeout(scrollTimer);
  };
  const flash = () => {
    cleanup();
    item.classList.remove('flash');
    void item.offsetWidth;
    item.classList.add('flash');
    setTimeout(() => item.classList.remove('flash'), 2000);
  };
  const onScroll = () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(flash, 80);
  };
  listBody.addEventListener('scroll', onScroll);
  fallbackTimer = setTimeout(flash, 2000);
  onScroll();
}

function jumpToList(value) {
  const num = parseInt(value, 10);
  if (isNaN(num) || num < 1 || num > quotes.length) return;
  document.getElementById('listJumpPopover').classList.remove('show');
  activeAuthors.clear();
  excludedTags.clear();
  currentSearch = '';
  const searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.value = '';
  applySearch();
  createFilter();
  const item = allItems.find(el => parseInt(el.dataset.index, 10) === num);
  if (item) {
    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
    runFlashAfterScroll(item);
  }
}

function positionPopover(trigger, popover) {
  const triggerRect = trigger.getBoundingClientRect();
  const popoverRect = popover.getBoundingClientRect();
  const viewportWidth = window.innerWidth;
  const gap = 8;
  const triggerCenter = triggerRect.left + triggerRect.width / 2;
  let desiredLeft = triggerCenter - popoverRect.width / 2;
  const maxLeft = viewportWidth - popoverRect.width - gap;
  if (desiredLeft < gap) desiredLeft = gap;
  if (desiredLeft > maxLeft) desiredLeft = maxLeft;
  const relativeLeft = desiredLeft - triggerRect.left;
  const arrowLeft = triggerCenter - desiredLeft;
  popover.style.left = relativeLeft + 'px';
  popover.style.setProperty('--arrow-left', arrowLeft + 'px');
}

function toggleListJumpPopover() {
  const popover = document.getElementById('listJumpPopover');
  const trigger = document.getElementById('listJumpWrap');
  const willShow = !popover.classList.contains('show');
  popover.classList.toggle('show');
  if (willShow) {
    popover.style.visibility = 'hidden';
    requestAnimationFrame(() => {
      positionPopover(trigger, popover);
      popover.style.visibility = '';
      const input = document.getElementById('listJumpInput');
      input.focus();
      input.select();
    });
  }
}

function toggleJumpPopover() {
  const popover = document.getElementById('jumpPopover');
  const trigger = popover.parentElement;
  const willShow = !popover.classList.contains('show');
  popover.classList.toggle('show');
  if (willShow) {
    popover.style.visibility = 'hidden';
    requestAnimationFrame(() => {
      positionPopover(trigger, popover);
      popover.style.visibility = '';
      const input = document.getElementById('quoteJumpInput');
      input.focus();
      input.select();
    });
  }
}

function jumpToQuote(value) {
  const popover = document.getElementById('jumpPopover');
  const input = document.getElementById('quoteJumpInput');
  const num = parseInt(value, 10);
  if (!isNaN(num) && num >= 1 && num < total) {
    if (num !== current) {
      showQuote(num);
      popover.classList.remove('show');
    }
  } else {
    if (input) input.value = current >= 1 ? current : '';
  }
}

function updateHash() {
  history.replaceState(null, '', location.search + '#page=' + current);
}

function readHash() {
  const hash = location.hash;
  if (!hash) return 0;
  let num = 0;
  if (hash.startsWith('#page=')) {
    num = parseInt(hash.slice(6), 10);
  } else {
    num = parseInt(hash.slice(1), 10);
  }
  if (!isNaN(num) && num >= 1 && num < total) {
    return num;
  }
  return 0;
}

document.addEventListener('keydown', (e) => {
  if (!quoteView.classList.contains('show')) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'ArrowRight') nextPage();
  if (e.key === 'ArrowLeft') prevPage();
});

async function getRealSize() {
  try {
    const res = await fetch('STZHONGS.woff2', { headers: { 'Range': 'bytes=0-0' }, cache: 'no-store' });
    if (res.status === 206) {
      const range = res.headers.get('Content-Range'); // bytes 0-0/12582912
      if (range) {
        const m = range.match(/\/(\d+)$/);
        if (m) return parseInt(m[1], 10);
      }
    }
  } catch (e) {}
  return 0;
}

async function loadFontWithProgress() {
  const progressInt = document.getElementById('progressInt');
  const progressDecimal = document.getElementById('progressDecimal');
  const progressRing = document.getElementById('progressRing');
  const radius = progressRing.r.baseVal.value;
  const circumference = 2 * Math.PI * radius;
  progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
  progressRing.style.strokeDashoffset = circumference;

  function setProgress(percent) {
    progressInt.textContent = Math.floor(percent);
    progressDecimal.textContent = (percent % 1).toFixed(2).slice(1) + '%';
    progressRing.style.strokeDashoffset = circumference - (percent / 100) * circumference;
  }
  try {
    let total = await getRealSize();
    const response = await fetch('STZHONGS.woff2');
    if (!total) {
      total = parseInt(response.headers.get('Content-Length') || '0', 10);
    }
    const reader = response.body.getReader();
    const chunks = [];
    let loaded = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.length;
      if (total) {
        setProgress((loaded / total) * 100);
      }
    }

    const allChunks = new Uint8Array(loaded);
    let pos = 0;
    for (const chunk of chunks) {
      allChunks.set(chunk, pos);
      pos += chunk.length;
    }

    // 以 data URL 注入 @font-face，确保华文中宋可用
    const blob = new Blob([allChunks], { type: 'font/woff2' });
    const dataUrl = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.onerror = rej;
      reader.readAsDataURL(blob);
    });
    const fontFaceStyle = document.createElement('style');
    fontFaceStyle.textContent = `@font-face{font-family:'STZhongsong';src:url('${dataUrl}') format('woff2');font-weight:normal;font-style:normal;font-display:swap;}`;
    document.head.appendChild(fontFaceStyle);

    setProgress(100);
  } catch (err) {
    console.error('字体加载失败', err);
  } finally {
    setTimeout(() => {
      document.getElementById('loadingOverlay').classList.add('hide');
    }, 200);
  }
}

loadFontWithProgress();

createList();

const initialSearch = readSearchParam();
if (initialSearch) {
  const input = document.getElementById('searchInput');
  if (input) input.value = initialSearch;
  applySearch();
}

const initialPage = readHash();
if (initialPage > 0) {
  showQuote(initialPage);
}
