<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名言</title>

<link rel="icon" href="img/favicon.ico" type="image/x-icon">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a7d5e">
<meta property="og:title" content="师生名言精选">
<meta property="og:description" content="共 689 条师生名言">
<meta property="og:type" content="website">
<meta property="og:url" content="https://teacherstudentquotes.github.io/">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root {
  --bg: #f5f0e8;
  --paper: #fffef8;
  --text: #333;
  --text-2: #666;
  --text-3: #888;
  --border: #ddd8ce;
  --border-2: #e8e2d4;
  --border-3: #ccc;
  --glass-bg: rgba(255, 253, 247, 0.55);
  --glass-bg-hover: rgba(255, 253, 247, 0.78);
  --glass-item-hover: rgba(140, 122, 90, 0.16);
  --glass-divider: rgba(140, 122, 90, 0.38);
  --glass-blur: blur(14px) saturate(1.35);
  --glass-border: rgba(140, 122, 90, 0.28);
  --glass-shadow:
    0 4px 14px rgba(96, 82, 54, 0.10),
    inset 0 1px 1px rgba(255, 255, 255, 0.90),
    inset 0 -1px 2px rgba(96, 82, 54, 0.14),
    inset 1px 0 1px rgba(255, 255, 255, 0.35),
    inset -1px 0 2px rgba(96, 82, 54, 0.08);
  --accent: #8a7d5e;
  --accent-hover: #756a4e;
  --hover: #eee;
  --hover-2: #faf7ef;
  --hover-3: #eee7d8;
  --pill-bg: #f3eddc;
  --pill-border: #e2dac6;
  --pill-text: #6b6353;
  --footer-bg: #faf6ec;
  --toast-bg: #4a4234;
  --toast-text: var(--paper);
  --indicator-bg: #2c2c2c;
  --indicator-text: var(--bg);
  --highlight: #ffe082;
  --highlight-text: var(--text);
  --mark: #ddd;
  --backdrop: rgba(40,34,22,0.4);
  --scroll: rgba(0,0,0,0.15);
  --scroll-hover: rgba(0,0,0,0.25);
  --shadow: rgba(0,0,0,0.18);
  --shadow-2: rgba(0,0,0,0.15);
}
[data-theme="dark"] {
  --bg: #171410;
  --paper: #211d15;
  --text: #e6dfd0;
  --text-2: #b0a894;
  --text-3: #8a8271;
  --border: #3a342a;
  --border-2: #2e2921;
  --border-3: #4a4436;
  --glass-bg: rgba(46, 40, 31, 0.5);
  --glass-bg-hover: rgba(46, 40, 31, 0.68);
  --glass-item-hover: rgba(255, 244, 224, 0.09);
  --glass-divider: rgba(255, 244, 224, 0.22);
  --glass-blur: blur(14px) saturate(1.2);
  --glass-border: rgba(255, 244, 224, 0.16);
  --glass-shadow:
    0 4px 16px rgba(0, 0, 0, 0.40),
    inset 0 1px 1px rgba(255, 244, 224, 0.25),
    inset 0 -1px 2px rgba(0, 0, 0, 0.38),
    inset 1px 0 1px rgba(255, 244, 224, 0.10),
    inset -1px 0 2px rgba(0, 0, 0, 0.28);
  --accent: #b5a27a;
  --accent-hover: #c9b68d;
  --hover: #2e2921;
  --hover-2: #29241c;
  --hover-3: #2e2921;
  --pill-bg: #2e2921;
  --pill-border: #3a342a;
  --pill-text: #a89f8c;
  --footer-bg: #1d1a13;
  --toast-bg: #e6dfd0;
  --toast-text: #171410;
  --indicator-bg: #e6dfd0;
  --indicator-text: #171410;
  --highlight: #8a7320;
  --highlight-text: #f5ecd0;
  --mark: #4a4436;
  --backdrop: rgba(0,0,0,0.6);
  --scroll: rgba(255,255,255,0.15);
  --scroll-hover: rgba(255,255,255,0.25);
  --shadow: rgba(0,0,0,0.5);
  --shadow-2: rgba(0,0,0,0.4);
}

@font-face {
  font-family: 'Computer Modern';
  src: url('fonts/cmu.serif-roman.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
  /* 排除引号（U+2018–201F），让中文弯引号回退到华文中宋渲染 */
  unicode-range: U+0000-007F, U+00A0-024F, U+0250-02AF, U+02B0-02FF, U+0300-036F, U+0370-03FF, U+0400-04FF, U+2000-2017, U+2020-206F, U+2070-209F, U+20A0-20CF, U+2100-214F, U+2150-218F, U+2190-21FF, U+2200-22FF, U+2300-23FF, U+2460-24FF, U+2500-257F, U+2580-259F, U+25A0-25FF, U+2600-26FF;
}
/* STZhongsong 字体由 JS 手动加载以显示进度 */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 默认隐藏滚动条 */
::-webkit-scrollbar { display: none; }
html {
  overflow: hidden;
}

html, body, .filter-dropdown, .quote-view {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

/* 列表视图滚动条（低调样式） */
.bi {
  vertical-align: -0.125em;
  /* BI字体视觉中心偏高，flex居中布局里下移修正 */
  transform: translateY(0.0625em);
}

.list-empty {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--text-3);
  padding: 20px;
  font-size: 1.15rem;
  letter-spacing: 0.08em;
  pointer-events: none;
}
.list-empty[hidden] { display: none; }

.list-body {
  scrollbar-width: thin;
  scrollbar-color: var(--scroll) transparent;
}

.list-body::-webkit-scrollbar {
  display: block;
  width: 5px;
}

.list-body::-webkit-scrollbar-track {
  background: transparent;
}

.list-body::-webkit-scrollbar-thumb {
  background: var(--scroll);
  border-radius: 3px;
}

.list-body::-webkit-scrollbar-thumb:hover {
  background: var(--scroll-hover);
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  background: var(--bg);
  font-family: 'Computer Modern', 'STZhongsong', "SimSun", "宋体", serif;
  overflow: hidden;
}

/* ===== 列表视图 ===== */
.list-view {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.list-header {
  padding: 24px 40px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg);
  z-index: 10;
}

.list-header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.title-wrap {
  display: flex;
  align-items: baseline;
  gap: 7px;
}

.list-header h1 {
  font-size: 2rem;
  color: var(--text);
  letter-spacing: 0.15em;
}

.list-header p {
  margin-top: 6px;
  font-size: 0.9rem;
  color: var(--text-3);
}

.filter-wrap {
  position: relative;
}

.search-wrap {
  position: relative;
}

.search-input {
  width: 180px;
  height: 36px;
  padding: 0 44px 0 32px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--glass-shadow);
  color: var(--text);
  border-radius: 999px;
  font-family: inherit;
  font-size: 0.95rem;
  outline: none;
}

.search-input:focus {
  border-color: var(--text-3);
  background: var(--glass-bg-hover);
}

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(calc(-50% + 0.0625em));
  color: var(--text-3);
  font-size: 0.85rem;
  pointer-events: none;
}

.search-count {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.8rem;
  color: var(--text-3);
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  pointer-events: none;
}

.search-highlight {
  background: var(--highlight);
  color: var(--text);
  border-radius: 2px;
  padding: 0;
}

.list-jump-wrap {
  position: relative;
  display: inline-block;
}

@media (max-width: 600px) {
  .search-input {
    width: 120px;
    font-size: 0.9rem;
  }
}

.filter-btn {
  width: 36px;
  height: 36px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--glass-shadow);
  color: var(--text-2);
  border-radius: 999px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95rem;
  transition: background 0.15s, transform 0.1s;
}

.filter-btn:hover {
  background: var(--glass-bg-hover);
}

.filter-dropdown {
  position: fixed;
  top: 24px;
  left: 24px;
  right: 24px;
  bottom: 24px;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 12px 40px var(--shadow);
  display: none;
  flex-direction: column;
  z-index: 320;
  overflow: hidden;
}

.filter-dropdown.show {
  display: flex;
}

.filter-backdrop {
  position: fixed;
  inset: 0;
  background: var(--backdrop);
  display: none;
  z-index: 315;
}

.filter-backdrop.show {
  display: block;
}

.filter-header {
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-2);
}

.filter-title {
  font-size: 1.05rem;
  font-weight: bold;
  color: var(--text);
}

.filter-close-btn {
  border: none;
  background: none;
  color: var(--text-3);
  font-size: 1.1rem;
  width: 32px;
  height: 32px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.filter-close-btn:hover {
  background: var(--hover-3);
  color: var(--text);
}

.filter-tags {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 4px 2px 12px;
}
.filter-tag-option {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 0.85rem;
  cursor: pointer;
  user-select: none;
  transition: opacity 0.15s ease;
}
.filter-tag-option input {
  display: none;
}
.filter-tag-option.off {
  opacity: 0.38;
  filter: saturate(0.2);
}
.filter-tag-option:hover {
  opacity: 1;
}
.filter-tag-count {
  font-size: 0.75rem;
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
}

.filter-options {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior-y: none;
  padding: 16px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
  align-content: start;
}

.filter-option {
  border: 1px solid var(--border-2);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 0.95rem;
  color: var(--text);
  cursor: pointer;
  background: var(--paper);
  display: flex;
  align-items: center;
  gap: 12px;
  max-height: 140px;
  transition: max-height .26s cubic-bezier(.4,0,.2,1), opacity .2s ease, padding .26s cubic-bezier(.4,0,.2,1), margin .26s cubic-bezier(.4,0,.2,1), border-color .26s ease, transform .26s cubic-bezier(.4,0,.2,1);
}
/* 作者跟随标签的收起过渡：负margin吞掉grid gap，收缩到零后JS再display:none */
.filter-option.f-hiding {
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  padding-top: 0;
  padding-bottom: 0;
  margin: -4px;
  border-color: transparent;
  transform: scale(.95);
  pointer-events: none;
}

.filter-option:hover {
  background: var(--bg);
}

.filter-option:has(.filter-checkbox[data-tag]):hover {
  background: inherit;
  filter: brightness(0.95);
}

.filter-option input[type="checkbox"] {
  width: 17px;
  height: 17px;
  accent-color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
}

.filter-option-main {
  flex: 1;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 10px;
  min-width: 0;
}

.filter-option-name {
  word-break: break-all;
}

.filter-abbr {
  font-size: 0.72rem;
  opacity: 0.65;
  margin-left: 0.45em;
}

.filter-option-pills {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
}

.filter-pill {
  font-size: 0.75rem;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--pill-bg);
  color: var(--pill-text);
  border: 1px solid var(--pill-border);
  white-space: nowrap;
}

.filter-option-count {
  font-size: 0.8rem;
  color: var(--text-3);
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  flex-shrink: 0;
}

.filter-footer {
  flex-shrink: 0;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border-top: 1px solid var(--border-2);
  background: var(--footer-bg);
}

.filter-confirm-btn {
  padding: 8px 28px;
  border: 1px solid var(--border-3);
  background: var(--accent);
  color: var(--paper);
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.95rem;
  cursor: pointer;
}

.filter-confirm-btn:hover {
  background: var(--accent-hover);
}

.filter-aux-btn {
  padding: 8px 18px;
  border: 1px solid var(--border-3);
  background: var(--paper);
  color: var(--text-2);
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.95rem;
  cursor: pointer;
}

.filter-aux-btn:hover {
  background: var(--hover);
}

.filter-section-title {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
  font-weight: bold;
  color: var(--accent);
  padding: 6px 2px 0;
}

.filter-section-btns {
  display: flex;
  gap: 2px;
}

.filter-section-btn {
  border: none;
  background: none;
  color: var(--accent);
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: normal;
  padding: 2px 8px;
  border-radius: 999px;
  cursor: pointer;
}

.filter-section-btn:hover {
  background: var(--hover-3);
}



.filter-footer .spacer {
  flex: 1;
}

@media (max-width: 600px) {
  .filter-dropdown {
    top: 12px;
    left: 12px;
    right: 12px;
    bottom: 12px;
  }
}

.list-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 40px 40px;
}

.list-item {
  padding: 14px 18px;
  margin-bottom: 10px;
  background: var(--paper);
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  display: flex;
  align-items: baseline;
  gap: 14px;
  border: 1px solid var(--border-2);
}

.list-item:hover {
  background: var(--hover-2);
  transform: translateX(4px);
  border-color: var(--border-3);
}

@keyframes flashItem {
  0%, 100% { background-color: var(--paper); }
  50% { background-color: var(--highlight); }
}

.list-item.flash {
  animation: flashItem 1s ease-in-out 2;
}

.list-item-index {
  font-size: 1rem;
  color: var(--text-2);
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  min-width: 42px;
  text-align: right;
  flex-shrink: 0;
  align-self: baseline;
}

.list-item-content {
  flex: 1;
  font-size: 1rem;
  color: var(--text);
  line-height: 1.6;
  word-break: break-all;
  overflow-wrap: anywhere;
}

.list-item-tags {
  display: none;
  flex-wrap: wrap;
  gap: 4px;
  justify-content: flex-end;
  align-content: flex-start;
  align-self: center;
  max-width: 170px;
  max-height: 3em;
  overflow: hidden;
  flex-shrink: 0;
}

@media (min-width: 601px) {
  .list-item-tags {
    display: flex;
  }
}

.tag-pill {
  display: inline-block;
  font-size: 0.72rem;
  line-height: 1.6;
  padding: 0 8px;
  border-radius: 999px;
  border: 1px solid;
  white-space: nowrap;
}

ruby {
  ruby-align: center;
  line-height: 1;
}

rt {
  font-size: 0.65em;
  color: var(--text-3);
  font-family: 'Computer Modern', 'STZhongsong', Cambria, Georgia, serif;
  line-height: 1.1;
}

.list-item {
  overflow: visible;
}

.list-item-author {
  font-size: 0.85rem;
  color: var(--text-3);
  flex-shrink: 0;
}

/* ===== 名言单页视图 ===== */
.quote-view {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  position: relative;
  display: none;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.quote-view.show {
  display: block;
}

.page {
  position: relative;
  width: 100%;
  min-height: 100%;
  background: var(--paper);
  padding: 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-sizing: border-box;
}
/* 内容超出一屏时：顶部对齐留白，页面向下生长可滚动，不再挤压遮挡 */
.page.tall {
  justify-content: flex-start;
  padding-top: 48px;
  padding-bottom: 180px;
}

.quote-mark {
  position: absolute;
  font-size: 8rem;
  color: var(--mark);
  font-family: 'STZhongsong', Georgia, serif;
  line-height: 1;
  user-select: none;
  z-index: 0;
}

.quote-mark.top-left {
  top: 30px;
  left: 40px;
}

.quote-mark.bottom-right {
  bottom: 30px;
  right: 40px;
}

[data-theme="dark"] .quote-content img { filter: invert(1); }

.quote-content {
  font-size: 1.8rem;
  line-height: 2.4;
  text-align: center;
  color: var(--text);
  max-width: 90%;
  word-break: break-all;
  overflow-wrap: anywhere;
  z-index: 2;
  transition: opacity 0.3s ease;
}

.quote-author {
  position: absolute;
  bottom: 80px;
  right: 80px;
  font-size: 1.3rem;
  color: var(--text-2);
  font-style: italic;
  transition: opacity 0.3s ease;
  z-index: 5;
}

.quote-author::before {
  content: "—— ";
}

.quote-tags {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 36px;
  padding-left: 8px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  max-width: 50%;
  z-index: 5;
}

.sw-version {
  font-family: ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;
  font-size: 0.68rem;
  color: var(--text-3);
  opacity: 0.55;
  align-self: center;
  user-select: none;
  letter-spacing: 0.02em;
}

.jump-expand {
  display: flex;
  align-items: center;
  height: 36px;
  width: 36px;
  padding: 0 6px;
}

.jump-expand-input {
  width: 76px;
  height: 26px;
  padding: 0;
  flex-shrink: 0;
  border: none;
  border-bottom: 1px solid var(--glass-border);
  border-radius: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
  text-align: center;
  opacity: 1;
}

.jump-expand-input::-webkit-outer-spin-button,
.jump-expand-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.jump-expand-input[type=number] { -moz-appearance: textfield; appearance: textfield; }


/* 单页跳转永远展开，宽度自适应内容 */
.action-bar .jump-expand {
  height: 42px;
  width: max-content;
  justify-content: flex-start;
}

/* 菜单内版：整行菜单项，展开时整行变输入框 */
.jump-expand-menu {
  width: 100%;
  height: auto;
  gap: 12px;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: none;
  border: none;
  background: transparent;
  border-radius: 8px;
  padding: 11px 14px;
  transition: none;
}



.jump-expand-label {
  flex: 1;
  margin-left: 12px;
  font-size: 0.95rem;
  color: var(--text);
}

.jump-expand-menu .jump-expand-input { flex: 0 0 auto; }
.jump-expand-menu .jump-expand-label { display: none; }

<script>
// ===== 主题管理 =====
(function initTheme() {
  const saved = localStorage.getItem('theme');
  const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
})();

function toggleTheme(evt) {
  const isDark = document.documentElement.dataset.theme === 'dark';
  const apply = () => {
    if (isDark) {
      delete document.documentElement.dataset.theme;
      localStorage.setItem('theme', 'light');
    } else {
      document.documentElement.dataset.theme = 'dark';
      localStorage.setItem('theme', 'dark');
    }
    updateThemeIcons();
    refreshTagPills();
  };

  // View Transitions：波纹圆心锚在主题按钮正中心，从按钮本体扩散揭示新模式
  if (!document.startViewTransition) { apply(); return; }
  const rect = (evt && evt.currentTarget && evt.currentTarget.getBoundingClientRect)
    ? evt.currentTarget.getBoundingClientRect() : null;
  const cx = rect ? rect.left + rect.width / 2 : innerWidth - 40;
  const cy = rect ? rect.top + rect.height / 2 : 40;
  const r0 = rect ? Math.max(rect.width, rect.height) / 2 : 0;
  const r = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy)) + r0;
  const vt = document.startViewTransition(apply);
  vt.ready.then(() => {
    document.documentElement.animate(
      [
        { clipPath: `circle(${r0}px at ${cx}px ${cy}px)` },
        { clipPath: `circle(${r}px at ${cx}px ${cy}px)` },
      ],
      { duration: 500, easing: 'cubic-bezier(.4,0,.2,1)', pseudoElement: '::view-transition-new(root)' }
    );
  }).catch(() => {});
}

function updateThemeIcons() {
  const isDark = document.documentElement.dataset.theme === 'dark';
  ['themeBtnList', 'themeBtnQuote'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.innerHTML = `<i class="bi ${isDark ? 'bi-sun-fill' : 'bi-moon-fill'}"></i>`;
  });
}

// ESC 关闭抽屉
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeActionMenu();
});

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

let current = 0;
const total = quotes.length + 1;

const listView = document.getElementById('listView');
const quoteView = document.getElementById('quoteView');
document.fonts.ready.then(fitQuotePage);
window.addEventListener('resize', fitQuotePage);

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 每个标签一组固定的胶囊配色（底色 / 边框 / 文字），共 6 色，相近主题共用
const TAG_PALETTE_LIGHT = [
  ['#fde2e2', '#e8a1a1', '#a13c3c'], // 0 红
  ['#fdeadc', '#e2ae7e', '#9a5a24'], // 1 橙
  ['#e0f2de', '#96cf92', '#2f6b2c'], // 2 绿
  ['#dcecfb', '#8fbde8', '#2c5a8a'], // 3 蓝
  ['#ededed', '#c2c2c2', '#545454'], // 4 灰
  ['#f0e2cf', '#c9a678', '#7c5227'], // 5 棕
];
const TAG_PALETTE_DARK = [
  ['#3a2323', '#7a4040', '#d49090'], // 0 红
  ['#3a2c1e', '#7a5c38', '#d4a878'], // 1 橙
  ['#23331f', '#40663a', '#90c088'], // 2 绿
  ['#1e2a38', '#3a5a7a', '#88a8cc'], // 3 蓝
  ['#2a2a2a', '#555555', '#a0a0a0'], // 4 灰
  ['#33281c', '#6b5232', '#c0a078'], // 5 棕
];
function tagPalette() {
  return document.documentElement.dataset.theme === 'dark' ? TAG_PALETTE_DARK : TAG_PALETTE_LIGHT;
}
// 按含义固定配色；有意控制颜色数量，同类标签共用一色
const TAG_COLOR_SLOT = {
  '日常': 4,         // 灰：平淡中性
  '屎尿屁': 5,       // 棕
  '吹牛': 5,         // 棕：牛皮
  '脏话': 0,         // 红
  '暴言': 0,         // 红：与脏话同属嘴臭类
  '外貌身材': 0,     // 红：火辣
  '感情八卦': 0,     // 红：桃色
  '动物世界': 2,     // 绿
  '琪琪与小花花': 2, // 绿：花/植物
  '开车': 1,         // 橙
  '吃的': 1,         // 橙：食物
  '作业考试': 3,     // 蓝
  '学科': 3,         // 蓝
  '班级纪律': 3,     // 蓝
  '网络梗': 3,       // 蓝
  '名人梗': 3,       // 蓝
};
const tagColorMaps = { light: {}, dark: {} };

function tagColors(tag) {
  const mode = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  const map = tagColorMaps[mode];
  if (!(tag in map)) {
    const palette = tagPalette();
    const n = tag in TAG_COLOR_SLOT
      ? TAG_COLOR_SLOT[tag]
      : Object.keys(map).length;
    map[tag] = palette[n % palette.length];
  }
  return map[tag];
}

// 主题切换后刷新已渲染的标签胶囊
function refreshTagPills() {
  document.querySelectorAll('.tag-pill').forEach(pill => {
    const tag = pill.textContent;
    const c = tagColors(tag);
    pill.style.background = c[0];
    pill.style.borderColor = c[1];
    pill.style.color = c[2];
  });
  // 筛选下拉里的标签底色
  document.querySelectorAll('#filterDropdown .filter-option').forEach(opt => {
    const cb = opt.querySelector('.filter-checkbox[data-tag]');
    if (!cb) return;
    const c = tagColors(cb.dataset.tag);
    opt.style.background = c[0];
    opt.style.borderColor = c[1];
    const name = opt.querySelector('.filter-option-name');
    if (name) name.style.color = c[2];
  });
}

// 按标签名排序后一次性分配颜色，保证同一次加载中颜色稳定
function initTagColors() {
  const all = new Set();
  quotes.forEach(q => (q.tags || []).forEach(t => all.add(t)));
  [...all].sort().forEach(tagColors);
}

function tagPillHtml(tag) {
  const c = tagColors(tag);
  return `<span class="tag-pill" style="background:${c[0]};border-color:${c[1]};color:${c[2]}">${escapeHtml(tag)}</span>`;
}

function renderMath(el) {
  if (typeof renderMathInElement !== 'function' || !el) return;
  if (!el.textContent.includes('$') && !el.textContent.includes('\\(')) return;
  try {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false
    });
  } catch (e) {
    console.error('KaTeX 渲染失败', e);
  }
}

const pinyinRegex = /([\u4e00-\u9fa5])\(([a-zA-Zāáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜüńňǹ\s]+?)\)/g;

function tokenizeContent(content) {
  const tokens = [];
  let lastIndex = 0;
  let match;
  pinyinRegex.lastIndex = 0;
  while ((match = pinyinRegex.exec(content)) !== null) {
    if (match.index > lastIndex) {
      for (const char of content.slice(lastIndex, match.index)) {
        tokens.push({ type: 'char', value: char });
      }
    }
    tokens.push({ type: 'ruby', char: match[1], pinyin: match[2] });
    lastIndex = pinyinRegex.lastIndex;
  }
  if (lastIndex < content.length) {
    for (const char of content.slice(lastIndex)) {
      tokens.push({ type: 'char', value: char });
    }
  }
  return tokens;
}

function renderContentWithPinyin(content, query = '') {
  const trimmed = content.trim();
  if (trimmed.startsWith('<img') || trimmed.startsWith('<svg')) {
    return content;
  }
  const tokens = tokenizeContent(content);
  let html = '';
  let i = 0;
  const lowerQuery = query.toLowerCase();
  while (i < tokens.length) {
    if (query) {
      const slice = tokens.slice(i, i + query.length).map(t => t.type === 'ruby' ? t.char : t.value).join('');
      if (slice.toLowerCase() === lowerQuery) {
        const matched = tokens.slice(i, i + query.length).map(t => renderToken(t)).join('');
        html += `<span class="search-highlight">${matched}</span>`;
        i += query.length;
        continue;
      }
    }
    html += renderToken(tokens[i]);
    i++;
  }
  return html;
}

function renderToken(t) {
  if (t.type === 'char') return escapeHtml(t.value);
  return `<ruby>${escapeHtml(t.char)}<rt>${escapeHtml(t.pinyin)}</rt></ruby>`;
}

let allItems = [];
const allAuthorsSet = new Set(quotes.map(q => q.author));
const activeAuthors = new Set();
const excludedTags = new Set();
let authorFilterApplied = false; /* true=用户确认过筛选；作者全不选=刻意空结果 */

function saveFilter() {
  localStorage.setItem('filterState', JSON.stringify({
    a: [...activeAuthors],
    x: [...excludedTags],
    p: authorFilterApplied,
  }));
}

function loadFilter() {
  try {
    const s = JSON.parse(localStorage.getItem('filterState') || 'null');
    if (!s) return;
    if (Array.isArray(s.a)) s.a.forEach(v => activeAuthors.add(v));
    if (Array.isArray(s.x)) s.x.forEach(v => excludedTags.add(v));
    authorFilterApplied = !!s.p;
  } catch (e) {}
}
loadFilter();

let currentSearch = '';

function createList() {
  initTagColors();
  document.getElementById('totalCount').textContent = quotes.length;
  const listBody = document.getElementById('listBody');
  allItems = [];
  quotes.forEach((q, i) => {
    const item = document.createElement('div');
    item.className = 'list-item';
    item.dataset.author = q.author;
    item.dataset.content = q.content;
    item.dataset.tags = (q.tags || []).join(',');
    item.dataset.index = i + 1;
    item.onclick = () => showQuote(i + 1);
    const preview = q.content;
    item.innerHTML = `
      <span class="list-item-index">${i + 1}</span>
      <span class="list-item-content">${renderContentWithPinyin(preview, '')}</span>
      <span class="list-item-tags">${(q.tags || []).map(tagPillHtml).join('')}</span>
      <span class="list-item-author">${escapeHtml(q.author)}</span>
    `;
    listBody.appendChild(item);
    renderMath(item.querySelector('.list-item-content'));
    allItems.push(item);
  });
  createFilter();
  fillJumpTotals();
  applySearch(); /* 启动时应用localStorage恢复的筛选（首次渲染默认全显） */
}

function fillJumpTotals() {
  document.querySelectorAll('.jump-expand-input').forEach(inp => {
    inp.max = quotes.length;
    inp.placeholder = '跳转至';
  });
}

function createFilter() {
  const dropdown = document.getElementById('filterDropdown');
  dropdown.innerHTML = '';
  const header = document.createElement('div');
  header.className = 'filter-header';
  header.innerHTML = `<span class="filter-title">筛选</span>` +
    `<button class="filter-close-btn" onclick="closeFilter()" title="关闭"><i class="bi bi-x-lg"></i></button>`;
  dropdown.appendChild(header);
  const authorCounts = {};
  quotes.forEach(q => {
    authorCounts[q.author] = (authorCounts[q.author] || 0) + 1;
  });
  const sortedAuthors = Object.entries(authorCounts)
    .sort((a, b) => b[1] - a[1])
    .map(entry => entry[0]);
  const tagCounts = {};
  quotes.forEach(q => {
    (q.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
  });
  const sortedTags = Object.entries(tagCounts)
    .sort((a, b) => b[1] - a[1])
    .map(entry => entry[0]);
  const options = document.createElement('div');
  options.className = 'filter-options';
  const makeSectionTitle = (text, kind) => {
    const title = document.createElement('div');
    title.className = 'filter-section-title';
    title.innerHTML = `<span>${text}</span>` +
      `<span class="filter-section-btns">` +
      `<button type="button" class="filter-section-btn" data-kind="${kind}" data-action="all">全选</button>` +
      `<button type="button" class="filter-section-btn" data-kind="${kind}" data-action="invert">反选</button>` +
      `</span>`;
    title.querySelectorAll('.filter-section-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (btn.dataset.action === 'all') toggleSelectAll(kind);
        else invertSelection(kind);
      });
    });
    return title;
  };
  if (sortedTags.length > 0) {
    options.appendChild(makeSectionTitle('标签', 'tag'));
    const tagWrap = document.createElement('div');
    tagWrap.className = 'filter-tags';
    sortedTags.forEach(tag => {
      const label = document.createElement('label');
      label.className = 'filter-tag-option';
      const c = tagColors(tag);
      const checked = !excludedTags.has(tag);
      label.style.background = c[0];
      label.style.borderColor = c[1];
      label.innerHTML = `<input type="checkbox" class="filter-checkbox" data-tag="${escapeHtml(tag)}"${checked ? ' checked' : ''}>` +
        `<span class="filter-tag-name" style="color:${c[2]}">${escapeHtml(tag)}</span>` +
        `<span class="filter-tag-count" style="color:${c[1]}">${tagCounts[tag]}</span>`;
      const cb = label.querySelector('input');
      const syncOff = () => label.classList.toggle('off', !cb.checked);
      syncOff();
      cb.addEventListener('click', (e) => {
        syncOff();
        updateSelectAllBtn('tag');
        syncAuthorVisibilityPreview();
        e.stopPropagation();
      });
      tagWrap.appendChild(label);
    });
    options.appendChild(tagWrap);
    options.appendChild(makeSectionTitle('作者', 'author'));
  }
  sortedAuthors.forEach(author => {
    const label = document.createElement('label');
    label.className = 'filter-option';
    const checked = !authorFilterApplied || activeAuthors.has(author);
    const count = authorCounts[author] || 0;
    let nameHtml = escapeHtml(author);
    let pillsHtml = '';
    const t = teachers.find(t => t.full === author);
    if (t) {
      nameHtml = `${escapeHtml(t.full)}<span class="filter-abbr">${escapeHtml(t.abbr)}</span>`;
      if (t.desc) pillsHtml += `<span class="filter-pill">${escapeHtml(t.desc)}</span>`;
      if (t.time) pillsHtml += `<span class="filter-pill">${escapeHtml(t.time)}</span>`;
    } else {
      const s = studentInfo(author);
      if (s) pillsHtml += `<span class="filter-pill">${s.cls}班${s.num}号</span>`;
    }
    label.innerHTML = `<input type="checkbox" class="filter-checkbox" data-author="${escapeHtml(author)}"${checked ? ' checked' : ''}>` +
      `<div class="filter-option-main"><span class="filter-option-name">${nameHtml}</span>` +
      (pillsHtml ? `<span class="filter-option-pills">${pillsHtml}</span>` : '') + `</div>` +
      `<span class="filter-option-count">${count}</span>`;
    label.querySelector('input').addEventListener('click', (e) => {
      updateSelectAllBtn('author');
      e.stopPropagation();
    });
    options.appendChild(label);
  });
  dropdown.appendChild(options);
  const footer = document.createElement('div');
  footer.className = 'filter-footer';
  footer.innerHTML = `<button class="filter-confirm-btn" onclick="confirmFilter()">确定</button>`;
  dropdown.appendChild(footer);
  updateSelectAllBtn('author');
  updateSelectAllBtn('tag');
  syncAuthorVisibility();
}

function allFilterCheckboxes() {
  return [...document.querySelectorAll('#filterDropdown .filter-checkbox[data-author]')]
    .filter(cb => isAuthorOptionVisible(cb));
}

// 作者项可见性（带收起/展开过渡）
function isAuthorOptionVisible(cb) {
  const opt = cb.closest('.filter-option');
  return opt.style.display !== 'none' && !opt.classList.contains('f-hiding');
}
function setAuthorOptionHidden(cb, hide) {
  const opt = cb.closest('.filter-option');
  clearTimeout(opt.__hideT);
  if (hide) {
    if (opt.style.display === 'none' || opt.classList.contains('f-hiding')) return;
    opt.classList.add('f-hiding');
    opt.__hideT = setTimeout(() => {
      opt.classList.remove('f-hiding');
      opt.style.display = 'none';
    }, 280);
  } else {
    if (opt.style.display !== 'none' && !opt.classList.contains('f-hiding')) return;
    opt.style.display = '';
    opt.classList.add('f-hiding');
    requestAnimationFrame(() => requestAnimationFrame(() => opt.classList.remove('f-hiding')));
  }
}

// 面板内预览版：按当前勾选状态（未点确定）即时收缩作者区
function syncAuthorVisibilityPreview() {
  const excluded = new Set();
  allTagCheckboxes().forEach(cb => { if (!cb.checked) excluded.add(cb.dataset.tag); });
  const eligible = new Set();
  quotes.forEach(q => {
    const tags = q.tags || [];
    if (tags.every(t => !excluded.has(t))) eligible.add(q.author);
  });
  document.querySelectorAll('#filterDropdown .filter-checkbox[data-author]').forEach(cb => {
    setAuthorOptionHidden(cb, !eligible.has(cb.dataset.author));
  });
}

// 作者区跟随标签选择：只显示拥有“当前未被排除标签”名言的作者
function syncAuthorVisibility() {
  const eligible = new Set();
  quotes.forEach(q => {
    const tags = q.tags || [];
    if (tags.every(t => !excludedTags.has(t))) eligible.add(q.author);
  });
  document.querySelectorAll('#filterDropdown .filter-checkbox[data-author]').forEach(cb => {
    setAuthorOptionHidden(cb, !eligible.has(cb.dataset.author));
  });
}

function allTagCheckboxes() {
  return [...document.querySelectorAll('#filterDropdown .filter-checkbox[data-tag]')];
}

function sectionBoxes(kind) {
  return kind === 'tag' ? allTagCheckboxes() : allFilterCheckboxes();
}

function updateSelectAllBtn(kind) {
  const btn = document.querySelector(`.filter-section-btn[data-kind="${kind}"][data-action="all"]`);
  if (!btn) return;
  const boxes = sectionBoxes(kind);
  btn.textContent = boxes.length > 0 && boxes.every(cb => cb.checked) ? '全不选' : '全选';
}

function toggleSelectAll(kind) {
  const boxes = sectionBoxes(kind);
  const allChecked = boxes.length > 0 && boxes.every(cb => cb.checked);
  boxes.forEach(cb => {
    cb.checked = !allChecked;
    const tagLabel = cb.closest('.filter-tag-option');
    if (tagLabel) tagLabel.classList.toggle('off', !cb.checked);
  });
  updateSelectAllBtn(kind);
  if (kind === 'tag') syncAuthorVisibilityPreview();
}

function invertSelection(kind) {
  sectionBoxes(kind).forEach(cb => {
    cb.checked = !cb.checked;
    const tagLabel = cb.closest('.filter-tag-option');
    if (tagLabel) tagLabel.classList.toggle('off', !cb.checked);
  });
  updateSelectAllBtn(kind);
  if (kind === 'tag') syncAuthorVisibilityPreview();
}

function confirmFilter(stay) {
  const prevAuthors = new Set(activeAuthors);
  activeAuthors.clear();
  allFilterCheckboxes().forEach(cb => {
    if (cb.checked) activeAuthors.add(cb.dataset.author);
  });
  // 被标签隐藏的作者：勾选状态冻结，不参与本次重建
  prevAuthors.forEach(a => {
    if (!activeAuthors.has(a) &&
        ![...document.querySelectorAll('#filterDropdown .filter-checkbox[data-author]')]
          .some(cb => cb.dataset.author === a && isAuthorOptionVisible(cb))) {
      activeAuthors.add(a);
    }
  });
  authorFilterApplied = true;
  excludedTags.clear();
  allTagCheckboxes().forEach(cb => {
    if (!cb.checked) excludedTags.add(cb.dataset.tag);
  });
  saveFilter();
  applySearch();
  syncAuthorVisibility();
  if (!stay) closeFilter();
}

function highlightText(text, query) {
  if (!query) return escapeHtml(text);
  const lowerText = text.toLowerCase();
  const lowerQuery = query.toLowerCase();
  let result = '';
  let lastIndex = 0;
  let index = lowerText.indexOf(lowerQuery);
  while (index !== -1) {
    result += escapeHtml(text.slice(lastIndex, index));
    result += `<span class="search-highlight">${escapeHtml(text.slice(index, index + query.length))}</span>`;
    lastIndex = index + query.length;
    index = lowerText.indexOf(lowerQuery, lastIndex);
  }
  result += escapeHtml(text.slice(lastIndex));
  return result;
}

function applySearch() {
  const input = document.getElementById('searchInput');
  currentSearch = input ? input.value.trim() : '';
  updateSearchParam(currentSearch);
  let visibleCount = 0;
  allItems.forEach(item => {
    const author = item.dataset.author;
    const content = item.dataset.content;
    const matchesFilter = !authorFilterApplied || activeAuthors.has(author);
    const itemTags = item.dataset.tags ? item.dataset.tags.split(',') : [];
    const matchesTag = itemTags.every(t => !excludedTags.has(t));
    const matchesSearch = !currentSearch ||
      author.toLowerCase().includes(currentSearch.toLowerCase()) ||
      content.toLowerCase().includes(currentSearch.toLowerCase());
    if (matchesFilter && matchesTag && matchesSearch) {
      item.style.display = 'flex';
      visibleCount++;
      const contentSpan = item.querySelector('.list-item-content');
      const authorSpan = item.querySelector('.list-item-author');
      if (contentSpan) {
        contentSpan.innerHTML = renderContentWithPinyin(content, currentSearch);
        renderMath(contentSpan);
      }
      if (authorSpan) authorSpan.innerHTML = highlightText(author, currentSearch);
    } else {
      item.style.display = 'none';
    }
  });
  const countEl = document.getElementById('searchCount');
  if (countEl) countEl.textContent = currentSearch ? visibleCount : '';
  const emptyEl = document.getElementById('listEmpty');
  if (emptyEl) emptyEl.hidden = visibleCount !== 0;

  // 副标题：有实际过滤效果时追加“符合条件xxx”，全选则不显示
  const subP = document.getElementById('listSub');
  if (subP) {
    const hasFilter = (authorFilterApplied && activeAuthors.size < allAuthorsSet.size) || excludedTags.size > 0;
    let html = `师生名言“精选”，共 <span id="totalCount">${quotes.length}</span> 条`;
    if (hasFilter) {
      let fc = 0;
      allItems.forEach(item => {
        const author = item.dataset.author;
        const itemTags = item.dataset.tags ? item.dataset.tags.split(',') : [];
        if ((!authorFilterApplied || activeAuthors.has(author)) && itemTags.every(t => !excludedTags.has(t))) fc++;
      });
      html += `，${fc} 条符合条件`;
    }
    subP.innerHTML = html;
  }
}

function runFlashAfterScroll(item) {
  const listBody = document.getElementById('listBody');
  let scrollTimer;
  let fallbackTimer;
  const cleanup = () => {
    listBody.removeEventListener('scroll', onScroll);
    clearTimeout(fallbackTimer);
    clearTimeout(scrollTimer);
  };
  const flash = () => {
    cleanup();
    item.classList.remove('flash');
    void item.offsetWidth;
    item.classList.add('flash');
    setTimeout(() => item.classList.remove('flash'), 2000);
  };
  const onScroll = () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(flash, 80);
  };
  listBody.addEventListener('scroll', onScroll);
  fallbackTimer = setTimeout(flash, 2000);
  onScroll();
}

function jumpToList(value) {
  const num = parseInt(value, 10);
  if (isNaN(num) || num < 1 || num > quotes.length) return;
  activeAuthors.clear();
  excludedTags.clear();
  currentSearch = '';
  const searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.value = '';
  applySearch();
  createFilter();
  const item = allItems.find(el => parseInt(el.dataset.index, 10) === num);
  if (item) {
    document.documentElement.scrollTop = 0;
    const lb = document.getElementById('listBody');
    const delta = item.getBoundingClientRect().top - lb.getBoundingClientRect().top
      - (lb.clientHeight - item.getBoundingClientRect().height) / 2;
    lb.scrollBy({ top: delta, behavior: 'smooth' });
    runFlashAfterScroll(item);
    document.querySelectorAll('.jump-expand-input').forEach(inp => { inp.value = ''; });
  }
}

async function getRealSize() {
  try {
    const res = await fetch('fonts/STZHONGS.subset.woff2', { headers: { 'Range': 'bytes=0-0' }, cache: 'no-store' });
    if (res.status === 206) {
      const range = res.headers.get('Content-Range'); // bytes 0-0/12582912
      if (range) {
        const m = range.match(/\/(\d+)$/);
        if (m) return parseInt(m[1], 10);
      }
    }
  } catch (e) {}
  return 0;
}

async function loadFontWithProgress() {
  // CSS默认隐藏，DOM渲染与CMU字体就绪后加.ready点亮
  const box = document.querySelector('.spinner-wrap');
  try {
    if (document.readyState === 'loading') {
      await new Promise((res) => document.addEventListener('DOMContentLoaded', res, { once: true }));
    }
    await Promise.race([
      Promise.all([
        document.fonts.load('16px "Computer Modern"'),
        document.fonts.load('italic 16px "Computer Modern"'),
      ]),
      new Promise((res) => setTimeout(res, 3000)),
    ]);
  } catch (e) {}
  box.classList.add('ready');

  const progressInt = document.getElementById('progressInt');
  const progressDecimal = document.getElementById('progressDecimal');
  const progressRing = document.getElementById('progressRing');
  const radius = progressRing.r.baseVal.value;
  const circumference = 2 * Math.PI * radius;
  progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
  progressRing.style.strokeDashoffset = circumference;

  function setProgress(percent) {
    progressInt.textContent = Math.floor(percent);
    progressDecimal.textContent = (percent % 1).toFixed(2).slice(1) + '%';
    progressRing.style.strokeDashoffset = circumference - (percent / 100) * circumference;
  }
  try {
    let total = await getRealSize();
    const response = await fetch('fonts/STZHONGS.subset.woff2');
    if (!total) {
      total = parseInt(response.headers.get('Content-Length') || '0', 10);
    }
    const reader = response.body.getReader();
    const chunks = [];
    let loaded = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.length;
      if (total) {
        setProgress((loaded / total) * 100);
      }
    }

    const allChunks = new Uint8Array(loaded);
    let pos = 0;
    for (const chunk of chunks) {
      allChunks.set(chunk, pos);
      pos += chunk.length;
    }

    // 以 data URL 注入 @font-face，确保华文中宋可用
    const blob = new Blob([allChunks], { type: 'font/woff2' });
    const dataUrl = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.onerror = rej;
      reader.readAsDataURL(blob);
    });
    const fontFaceStyle = document.createElement('style');
    fontFaceStyle.textContent = `@font-face{font-family:'STZhongsong';src:url('${dataUrl}') format('woff2');font-weight:normal;font-style:normal;font-display:swap;}`;
    document.head.appendChild(fontFaceStyle);

    setProgress(100);
  } catch (err) {
    console.error('字体加载失败', err);
  } finally {
    setTimeout(() => {
      document.getElementById('loadingOverlay').classList.add('hide');
    }, 200);
  }
}

// --- 迷你 LaTeX 渲染器：\frac \dfrac \sqrt \pi ---
function parseMath(src) {
  const nodes = [];
  let i = 0;
  while (i < src.length) {
    if (src[i] === '\\') {
      const rest = src.slice(i);
      let m;
      if ((m = rest.match(/^\\d?frac/))) {
        // 参数可以是 {组} 或裸字符
        const readGroup = (start) => {
          if (src[start] === '{') {
            let d = 0, k = start;
            for (; k < src.length; k++) {
              if (src[k] === '{') d++;
              else if (src[k] === '}') { d--; if (d === 0) break; }
            }
            return [src.slice(start + 1, k), k + 1];
          }
          return [src[start] || '', start + 1];
        };
        let pos = i + m[0].length;
        while (src[pos] === ' ') pos++;
        const [num, afterNum] = readGroup(pos);
        const [den, afterDen] = readGroup(afterNum);
        nodes.push({ type: 'frac', num: parseMath(num), den: parseMath(den) });
        i = afterDen;
        continue;
      }
      if ((m = rest.match(/^\\sqrt/))) {
        let pos = i + m[0].length;
        while (src[pos] === ' ') pos++;
        if (src[pos] === '{') {
          let d = 0, k = pos;
          for (; k < src.length; k++) {
            if (src[k] === '{') d++;
            else if (src[k] === '}') { d--; if (d === 0) break; }
          }
          nodes.push({ type: 'sqrt', body: parseMath(src.slice(pos + 1, k)) });
          i = k + 1;
        } else {
          nodes.push({ type: 'sqrt', body: parseMath(src[pos] || '') });
          i = pos + 1;
        }
        continue;
      }
      if ((m = rest.match(/^\\pi/))) {
        nodes.push({ type: 'char', ch: 'π' });
        i += 3;
        continue;
      }
      // 未知命令：跳过反斜杠按普通字符处理
      i += 1;
      continue;
    }
    if (src[i] === '{' || src[i] === '}') { i++; continue; }
    nodes.push({ type: 'char', ch: src[i] });
    i++;
  }
  return nodes;
}

function mathSize(nodes) {
  // 返回 {w, h, bl}：宽、高、基线（从顶部到基线的距离）
  let w = 0, hAbove = 0, hBelow = 0;
  for (const n of nodes) {
    if (n.type === 'char') {
      w += currentCtx.measureText(n.ch).width;
      hAbove = Math.max(hAbove, MATH_FS * 0.8);
      hBelow = Math.max(hBelow, MATH_FS * 0.25);
    } else if (n.type === 'frac') {
      const s = mathBox(n);
      w += s.w;
      hAbove = Math.max(hAbove, s.bl);
      hBelow = Math.max(hBelow, s.h - s.bl);
    } else if (n.type === 'sqrt') {
      const s = mathBox(n);
      w += s.w;
      hAbove = Math.max(hAbove, s.bl);
      hBelow = Math.max(hBelow, s.h - s.bl);
    }
  }
  return { w, h: hAbove + hBelow, bl: hAbove };
}

let currentCtx = null, MATH_FS = 28;

function mathBox(node) {
  // frac: 分子在上、分数线、分母在下
  if (node.type === 'frac') {
    const nw = mathSize(node.num), dw = mathSize(node.den);
    const w = Math.max(nw.w, dw.w) + MATH_FS * 0.5;
    const lineH = Math.max(1.5, MATH_FS * 0.06);
    const gap = MATH_FS * 0.18;
    const h = nw.h + dw.h + lineH + gap * 2;
    const bl = nw.h + gap + lineH / 2 + MATH_FS * 0.15; // 基线≈分数线略下
    return { w, h, bl, nw, dw, lineH, gap };
  }
  if (node.type === 'sqrt') {
    const b = mathSize(node.body);
    const pad = MATH_FS * 0.12, rootW = MATH_FS * 0.65;
    return { w: b.w + rootW + pad, h: b.h + pad, bl: b.bl + pad / 2, body: b, rootW, pad };
  }
  return { w: 0, h: 0, bl: 0 };
}

function drawMathNode(ctx, node, x, yTop) {
  if (node.type === 'char') {
    ctx.fillText(node.ch, x, yTop + MATH_FS * 0.8);
    return ctx.measureText(node.ch).width;
  }
  if (node.type === 'frac') {
    const b = mathBox(node);
    // 分子（右对齐于盒子中心）
    let nx = x + (b.w - b.nw.w) / 2;
    for (const n of node.num) { nx += drawMathNode(ctx, n, nx, yTop); }
    // 分数线
    const ly = yTop + b.nw.h + b.gap + b.lineH / 2;
    ctx.save();
    ctx.lineWidth = b.lineH;
    ctx.strokeStyle = ctx.fillStyle;
    ctx.beginPath();
    ctx.moveTo(x + 2, ly);
    ctx.lineTo(x + b.w - 2, ly);
    ctx.stroke();
    ctx.restore();
    // 分母
    let dx = x + (b.w - b.dw.w) / 2;
    const dy = yTop + b.nw.h + b.gap * 2 + b.lineH;
    for (const n of node.den) { dx += drawMathNode(ctx, n, dx, dy); }
    return b.w;
  }
  if (node.type === 'sqrt') {
    const b = mathBox(node);
    // 根号路径
    const rt = yTop, rb = yTop + b.h, rr = x + b.rootW, bodyX = x + b.rootW + b.pad;
    ctx.save();
    ctx.lineWidth = Math.max(1.5, MATH_FS * 0.05);
    ctx.strokeStyle = ctx.fillStyle;
    ctx.beginPath();
    ctx.moveTo(x, rt + b.h * 0.45);
    ctx.lineTo(x + b.rootW * 0.3, rb);
    ctx.lineTo(rr, yTop + b.pad / 2 + b.body.bl - b.body.h + b.pad * 0.5);
    ctx.lineTo(bodyX + b.body.w + 2, yTop + b.pad / 2 + b.body.bl - b.body.h + b.pad * 0.5);
    ctx.stroke();
    ctx.restore();
    const innerY = yTop + b.pad / 2 + b.body.bl - b.body.bl; // 内容顶部
    let cx = bodyX;
    for (const n of node.body) { cx += drawMathNode(ctx, n, cx, innerY); }
    return b.w;
  }
  return 0;
}

// 把含 $...$ 的文本切成交替的 plain / math item
function splitMathText(text) {
  const items = [];
  const re = /\$([^$]+)\$/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) items.push({ kind: 'plain', text: text.slice(last, m.index) });
    items.push({ kind: 'math', src: m[1] });
    last = m.index + m[0].length;
  }
  if (last < text.length) items.push({ kind: 'plain', text: text.slice(last) });
  return items;
}

// --- 正文排版 ---
// 先在整段文本层面分离公式，再对普通文本做 ruby 切分
function layoutQuote(ctx, content, maxWidth, fontSize) {
  const lineH = fontSize * 2.4;
  const items = [];

  for (const part of splitMathText(content)) {
    if (part.kind === 'math') {
      MATH_FS = fontSize;
      const prev = currentCtx;
      currentCtx = ctx;
      const nodes = parseMath(part.src);
      const s = mathSize(nodes);
      currentCtx = prev;
      items.push({
        w: s.w, h: s.h, bl: s.bl, spacing: fontSize * 0.1,
        draw(c, x, blY) {
          const p = currentCtx;
          currentCtx = c;
          c.font = `${fontSize}px ${FONT_STACK}`;
          const topY = blY - s.bl - fontSize * 0.8 + fontSize * 0.8; // = blY - s.bl
          let mx = x;
          for (const n of nodes) { mx += drawMathNode(c, n, mx, topY); }
          currentCtx = p;
        }
      });
      continue;
    }
    // plain：走 ruby 分词
    for (const t of tokenizeContent(part.text)) {
      if (t.type === 'ruby') {
        ctx.font = `${fontSize}px ${FONT_STACK}`;
        const bw = ctx.measureText(t.char).width;
        ctx.font = `${fontSize * 0.5}px ${FONT_STACK}`;
        const tw = ctx.measureText(t.pinyin).width;
        items.push({
          w: Math.max(bw, tw), h: fontSize * 1.45, bl: fontSize * 0.8, spacing: 0,
          draw(c, x, blY) {
            c.font = `${fontSize * 0.5}px ${FONT_STACK}`;
            c.fillText(t.pinyin, x + (this.w - tw) / 2, blY - fontSize * 0.72);
            c.font = `${fontSize}px ${FONT_STACK}`;
            c.fillText(t.char, x + (this.w - bw) / 2, blY);
          }
        });
      } else {
        ctx.font = `${fontSize}px ${FONT_STACK}`;
        const ch = t.value;
        const w = ctx.measureText(ch).width;
        items.push({
          w, h: fontSize, bl: fontSize * 0.8, spacing: fontSize * 0.05,
          draw(c, x, blY) { c.font = `${fontSize}px ${FONT_STACK}`; c.fillText(ch, x, blY); }
        });
      }
    }
  }

  // 贪心换行
  const lines = [];
  let cur = [], curW = 0;
  for (const it of items) {
    const add = it.w + (cur.length ? it.spacing : 0);
    if (cur.length && curW + add > maxWidth) {
      lines.push(cur);
      cur = [it]; curW = it.w;
    } else {
      cur.push(it); curW += add;
    }
  }
  if (cur.length) lines.push(cur);
  return { lines, lineH };
}

async function renderQuoteCanvas(index) {
  await ensureFonts();
  const q = quotes[index - 1];
  if (!q) return null;

  // 画布 = 当前视口 CSS 像素模型：与页面显示逐像素对应（所见即所得）
  const vw = quoteView.clientWidth || 1100;
  const vh = quoteView.clientHeight || 760;
  const canvas = document.createElement('canvas');
  canvas.width = vw * EXPORT_SCALE;
  canvas.height = vh * EXPORT_SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(EXPORT_SCALE, EXPORT_SCALE);
  const EXPORT_W = vw, EXPORT_H = vh;

  const paper = cssVar('--paper') || '#fffef8';
  const textColor = cssVar('--text') || '#333';
  const accent = cssVar('--accent') || '#8a7d5e';

  // 纸张背景
  ctx.fillStyle = paper;
  ctx.fillRect(0, 0, EXPORT_W, EXPORT_H);

  // 大引号
  ctx.fillStyle = cssVar('--mark') || '#ddd';
  ctx.font = `128px "STZhongsong",${FONT_STACK}`;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('“', 40, 158);
  const blW = ctx.measureText('”').width;
  ctx.fillText('”', EXPORT_W - 40 - blW, EXPORT_H - 30);

  // 正文
  ctx.fillStyle = textColor;
  ctx.textAlign = 'left';
  const fontSize = 28.8;
  const isImg = q.content.trim().startsWith('<img');
  let contentH;

  if (isImg) {
    const src = (q.content.match(/src="([^"]+)"/) || [])[1];
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = src; });
    const h = fontSize * 2.8, w = img.width * (h / img.height);
    ctx.drawImage(img, (EXPORT_W - w) / 2, (EXPORT_H - h) / 2 - 20);
    contentH = h;
  } else {
    const { lines, lineH } = layoutQuote(ctx, q.content, EXPORT_W * 0.9, fontSize);
    contentH = lines.length * lineH;
    let y = EXPORT_H / 2 - contentH / 2 + lineH / 2;
    for (const line of lines) {
      const lineW = line.reduce((s, it, i) => s + it.w + (i ? it.spacing : 0), 0);
      let x = (EXPORT_W - lineW) / 2;
      const blY = y + fontSize * 0.8 + (lineH - fontSize * 1.05) / 2;
      for (const it of line) {
        it.draw(ctx, x, blY);
        x += it.w + it.spacing;
      }
      y += lineH;
    }
  }

  // 作者：右下，斜体
  ctx.font = `italic 20.8px ${FONT_STACK}`;
  ctx.fillStyle = cssVar('--text-2') || '#666';
  const authorText = '—— ' + q.author;
  const aw = ctx.measureText(authorText).width;
  ctx.fillText(authorText, EXPORT_W - 80 - aw, EXPORT_H - 80);

  // 标签：左下角胶囊
  const tags = (q.tags || []).slice(0, 5);
  let tx = 0;
  const ty = EXPORT_H - 36;
  ctx.font = `13px ${FONT_STACK}`;
  for (const tag of tags) {
    const c = tagColors(tag);
    const tw = ctx.measureText(tag).width;
    const pw = tw + 24, ph = 22;
    ctx.fillStyle = c[0];
    ctx.strokeStyle = c[1];
    ctx.beginPath();
    ctx.roundRect(tx, ty + (36 - ph) / 2, pw, ph, 11);
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = c[2];
    ctx.fillText(tag, tx + 12, ty + (36 + ph) / 2 - 6);
    ctx.fillStyle = textColor;
    tx += pw + 8;
  }

  // 梯形页码：右下 60×36，斜切左边
  const pw2 = 60, ph2 = 36, cut = 15;
  const px = EXPORT_W - pw2, py = EXPORT_H - ph2;
  ctx.fillStyle = cssVar('--indicator-bg') || '#2c2c2c';
  ctx.beginPath();
  ctx.moveTo(px + cut, py);
  ctx.lineTo(px + pw2, py);
  ctx.lineTo(px + pw2, py + ph2);
  ctx.lineTo(px, py + ph2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = cssVar('--indicator-text') || '#f5f0e8';
  ctx.font = `14px ${FONT_STACK}`;
  ctx.textAlign = 'center';
  ctx.fillText(String(index), px + (pw2 + cut) / 2, py + ph2 / 2 + 5);
  ctx.textAlign = 'left';

  return canvas;
}



function toggleActionMenu(which) {
  const target = document.getElementById('listDrawer');
  const backdrop = document.getElementById('drawerBackdrop');
  const opening = !target.classList.contains('open');
  closeActionMenu();
  if (opening) {
    target.classList.add('open');
    backdrop.classList.add('open');
  }
}

function closeActionMenu() {
  document.getElementById('listDrawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
  collapseJumpAll();
}

function toggleJumpExpand(el) {
  const input = el.querySelector('.jump-expand-input');
  if (input) { input.focus(); input.select(); }
}

function collapseJumpAll() {
  document.querySelectorAll('.jump-expand.open').forEach(j => j.classList.remove('open'));
}


updateThemeIcons();
loadFontWithProgress();

// PWA Service Worker：检测到新版本立即激活并自动刷新一次
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  let __swRefreshing = false;
  const __refreshVer = () => {
    const m = (navigator.serviceWorker.controller?.scriptURL || '').match(/tsq-(v\d+)/);
    document.querySelectorAll('.sw-version').forEach((el) => {
      el.textContent = m ? m[1] : '';
      el.style.display = m ? '' : 'none';
    });
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // 交接瞬间controller可能为null，不刷新徽标（马上reload重画，避免闪没）
    if (__swRefreshing) return;
    __swRefreshing = true;
    location.reload();
  });
  __refreshVer();
  navigator.serviceWorker.register('sw.js?v=tsq-v62').then((reg) => {
    const kick = (worker) => {
      if (worker && navigator.serviceWorker.controller) {
        worker.postMessage({ type: 'SKIP_WAITING' });
      }
    };
    if (reg.waiting) kick(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed') kick(nw);
      });
    });
    // 每次启动也检查一次服务端是否有新版
    setTimeout(() => reg.update().catch(() => {}), 3000);
  }).catch(() => {});
}

if (initialSearch) {
  const input = document.getElementById('searchInput');
  if (input) input.value = initialSearch;
  applySearch();
}

const initialPage = readHash();
if (initialPage > 0) {
